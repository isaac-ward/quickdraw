services:
  app:
    build: .
    runtime: nvidia
    gpus: all                        # expose all GPUs (Compose v2)
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              count: all
    env_file: .env
    environment:
      # graphics: lets VTK use the NVIDIA EGL ICD to render on the GPU (default is compute,utility ONLY,
      # which forces the slow OSMesa/llvmpipe CPU software renderer). compute,utility kept for training.
      NVIDIA_DRIVER_CAPABILITIES: graphics,compute,utility
    shm_size: "16gb"               # DataLoader workers need it
    volumes:
      - ./src:/app/src             # editable install -> code edits go live without rebuilding
      - ./conf:/app/conf           # edit configs without rebuilding
      - ./.env:/app/.env           # live host .env (repo root isn't mounted, so the baked copy is stale);
      #                              also loaded into the env via `env_file: .env` above (needs `up -d` to refresh)
      - ./logs:/app/logs           # run folders, checkpoints, media
      - caches:/caches             # persist torch.compile + HF caches across runs
    # bring the container up idle; run steps yourself via `docker compose exec app bash`
    command: sleep infinity

volumes:
  caches:
