# The single-file full-contract example env (environments/examples/pendulum.py) — gym Pendulum-v1 physics.
name: pendulum    # env-registry name (environments/registry.make_env)
dt: 0.05          # integration step
max_torque: 2.0   # action clip: torque in [-max_torque, max_torque]
g: 10.0           # gravity
m: 1.0            # mass
l: 1.0            # rod length
preview_fps: 30   # mp4 PLAYBACK rate for human-viewing products (eval rollouts, summary videos), in Hz.
#                   Frames are REPEATED to reach it, never blended, so duration is exact and no pixel the
#                   model never produced appears (viz.pace). It does NOT touch dataset videos, which are
#                   data. Set null to encode at the frames' own rate -- which for a strided run is the
#                   MODEL STEP rate (e.g. 15 Hz data at subsample=4 -> 3.75 Hz, a 34 s clip), not 1/dt.
