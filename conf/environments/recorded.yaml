name: recorded    # env-registry name (environments/registry.make_env) — recorded trajectories, no simulator
obs_dim: 16       # recorded state dim (flightroom-starling processed dump)
action_dim: 4     # recorded action dim
dt: 0.0333333     # FALLBACK ONLY. env_cfg auto-reads the dataset's own fps (summary.json) as dt=1/fps; this
                  # value is used only if the dataset has no fps, with a loud warning. 30 Hz = starling default.
position_idx: [0, 1, 2]  # obs dims that are ambient world xyz for flow/manifold viz. DATASET-SPECIFIC: set to the
#                          real position triple (e.g. robocasa 16-D EEF = [7,8,9]; xarm7 28-D right-arm = [0,1,2]).
#                          EXPLICITLY setting this ALSO makes eval pointwise_error the POSITION-only L2 over these
#                          dims — and pointwise_error is the recorded checkpoint_metric, so best.ckpt then selects on
#                          POSITION error (intended for e.g. docking). Leave UNSET -> full-observation L2 (a [0,1,2]
#                          guess is NOT applied to pointwise_error), warned once. obs_error is always the full vector.
preview_fps: 30   # mp4 container rate for human-viewing products (eval rollouts, summary videos), in Hz.
#                   ONE FRAME PER CONTAINER FRAME: frames are never repeated, interpolated or dropped, so
#                   this is 30 UNIQUE frames per second with an even cadence. A preview therefore plays
#                   FASTER THAN REAL TIME when the true step rate is lower -- on 15 Hz data that is 2x at
#                   stride 1, 6x at stride 3, 8x at stride 4 -- and the factor is printed to progress.log
#                   once per run. Set null to encode at the true step rate (real time), which for a strided
#                   run is a slideshow: 128 steps at 3.75 Hz is 34 s. Does NOT touch dataset videos, which
#                   are data (see viz.save_mp4 and data/processors.py).
