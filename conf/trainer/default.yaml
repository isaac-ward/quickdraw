max_epochs: 50
precision: bf16-mixed
save_top_k: 2
check_val_every_n_epoch: 1   # validate EVERY epoch (default). Val is an autoregressive rollout ~as long as a train
#                              epoch, so this ~doubles wall-clock — raise it (e.g. 3) to trade val density for speed.
accumulate_grad_batches: 1   # keep 1: grad-accum sums micro-batch grads (~Nx effective LR vs the clip) and
#                              destabilizes in-rollout training — use a real batch that fits, never micro+accum.
