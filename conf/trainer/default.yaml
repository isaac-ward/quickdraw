max_epochs: 50
precision: bf16-mixed
save_top_k: 8    # keep the top-8 epochs by checkpoint_monitor (was 2) so several are available for post-hoc
checkpoint_monitor: null     # null -> AUTO: `val/metric/<image>/mse` when the model has an image modality,
#                              else `val/metric/proprio/<env.checkpoint_metric>` (recorded: pointwise_error).
#                              WHY THE AUTO DEFAULT CHANGED (2026-08-24, user): the old fallback was ALWAYS the
#                              env's proprio metric, a leftover from when models were proprio-only — so on an
#                              image run best.ckpt was chosen blind to every image result. Measured case:
#                              bott_bott16's best.ckpt landed on e8 while its floor peaked at e14 and its
#                              perceptual distance at e18. mse (NOT psnr) because psnr = -10*log10(mse), so
#                              minimising mse is EXACTLY maximising psnr while staying a min-metric.
#                              Set to any fully-qualified logged key to override — e.g.
#                              val/loss/physics/proprio for a physics-prior WM.
checkpoint_mode: null        # null -> AUTO from the metric name: "max" for psnr/ssim/acc/reward/r2, else "min".
#                              Set explicitly to force it. THIS KNOB EXISTS BECAUSE mode WAS HARDCODED "min":
#                              pointing checkpoint_monitor at a higher-is-better metric (e.g. .../psnr) silently
#                              selected the WORST epoch. The resolved rule + direction is printed to
#                              progress.log at fit start by BestCkptMirror.
check_val_every_n_epoch: 4   # DECIDED (user, 2026-07-20): validate every 4 epochs. DO NOT CHANGE without asking.
#                              Val is an autoregressive rollout ~as long as a train epoch, so more-frequent val
#                              wastes wall-clock; every-4 is the agreed cadence.
accumulate_grad_batches: 1   # LOCKED at 1. NEVER use gradient accumulation (micro-batch + accum): Lightning SUMS
#                              micro-batch grads -> ~Nx effective LR against the clip -> destabilized in-rollout
#                              training into mean-collapse (2026-07-20). Always use a real batch that fits. DO NOT CHANGE.
