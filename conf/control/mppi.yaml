horizon: 32            # plan-ahead steps (~0.53s @60Hz). Long horizon self-penalizes overshoot (the
                       # receding window sees the agent pass the goal), so it brakes WITHOUT a velocity term.
chunk: 8               # execute this many steps of each plan before replanning (replans = max_steps/chunk;
                       # ~chunk x fewer solves). Bigger = faster eval but longer open-loop commit -> hurts the
                       # LEARNED controller more (model drift before it can correct), so keep <= horizon/4-ish.
num_samples: 256       # MPPI candidate action sequences per step (eval cost ~ max_steps x num_samples x horizon)
noise_sigma: 2.0       # candidate exploration std (a_max=4.0, ~half). Higher -> more aggressive thrust tried.
lambda_: 0.3           # softmax temperature. Lower -> sharper, commits harder to the best candidate.
mean_decay: 1.0
tol: 0.15              # within this ambient distance of a goal counts as "at" it
settle_steps: 45       # consecutive in-tol steps before advancing (~0.75s @60Hz dwell to confirm arrival)
max_steps: 1000        # per-episode step budget for the whole goal sequence (ends early when all done);
                       # ~200 steps/goal at 5 goals (settle=30/goal + travel). Early-break needs ALL
                       # episodes of BOTH controllers done, so an imperfect pred runs ~to this cap.
beta_ctrl: 0.02        # control (action-magnitude) cost: penalty on sum_h ||a_h||^2 so the planner
                       # prefers cheaper thrust and settles with less jitter. Applies to BOTH controllers
                       # (shared cost). NOTE: was 0 (off) for the in-flight variation campaign, so absolute
                       # control numbers across that boundary aren't directly comparable — but the
                       # pred-vs-oracle gap (the meaningful quantity) stays fair since both share the cost.
beta_vel: 0.0          # near-goal velocity penalty OFF: it made the controller stall at the gate boundary
                       # (entering cost more in velocity than it gained in distance). Pure -distance + the
                       # long horizon reach-and-stop reliably (oracle: 3/3 goals, ~4.8s). Knob kept at 0.
r_settle: 0.5          # distance under which the velocity penalty would turn on (unused while beta_vel=0)
n_episodes: 8          # parallel control episodes (random inits/orders); video is episode 0
n_goals: 5             # goals visited per episode (random subset of the 8 NESW in/out goals)
reuse_render: true     # control video renderer reuse. true: FAST persistent plotter (cached mesh, swap
                       # only dynamic actors). The iso saturation flash is fixed at the SOURCE by
                       # number_of_peels=12 in viz.py (the iso diagonal pierces >4 translucent layers, the
                       # real cause); reuse was never the lever, so keep the fast path. false: fresh plotter
                       # per frame (slow; only if the peel fix ever proves insufficient under contention).
