# Language reward head R(latent, text): distilled from an eval_interpret run's (latent, label) pairs.
# Trained torch-only (MiniLM embeds text via `transformers`, mean-pooled). See design/language_steering.md.

interpret_run: logs/eval_interpret_2026_07_08_04_07_28_interpret_r3diff_v4   # source run (has projections/ + labels.json + captions)
# ---- objective: CLIP-style caption contrastive. Align f_z(latent) with f_t(MiniLM(caption)) over each clip's N
#      captions; the loss is (latent, caption) pairs — NO per-factor prototypes. `factors` here is used only for
#      eval coloring + the steering-readiness probe (score latents vs bucket words), never for the training loss. ----
factors: [color, positioning]   # factors for eval/coloring/probe only (the loss is caption-contrastive)
factor: color            # fallback if `factors` is unset (single-factor). Must be conf/interpret factors.
soft_targets: false      # KEEP FALSE (vanilla CLIP InfoNCE) — this is the validated default. DO NOT enable soft.
#   Empirical (2026-07, 5 compound requests x 2 heads, identical data): vanilla mean final distance-to-request
#   0.567 vs soft 0.935; vanilla won 4/5 and soft FAILED to steer top-red / lower-blue (distance rose, i.e. MPPI
#   couldn't reduce even its own objective -> soft's credit-spreading flattens the reward landscape). The 7.6%
#   measured false-negative rate does NOT hurt vanilla enough to matter. See design/models (language steering).
#   false = own caption is the only positive (same-combo captions are false negatives — harmless here).
#   true  = per-batch caption-caption MiniLM similarity IS the target (semantically-equal captions share credit).
caption_tau: 0.1         # soft-target temperature (only used if soft_targets=true, which we don't): low -> only
#                          near-identical captions count as soft-positive (~vanilla); high -> broader neighborhoods.
embed_dim: 128           # shared f_z/f_t projection dim
hidden: 256              # MLP hidden width
epochs: 300
report_every: 10         # log train/val metrics (+ progress.log line) every N epochs
lr: 1.0e-3
batch: 512               # also the contrastive batch = number of in-batch negatives
temperature: 0.07        # cosine-logit temperature for the contrastive softmax
# ---- regularization (the reward head overfits badly: train loss ~0.1 vs val ~1.9; more data didn't help) ----
weight_decay: 0.01       # Adam L2 penalty -> smoother f_z/f_t
dropout: 0.1             # dropout after the GELU in f_z/f_t (inert at eval; saved in reward_head.pt for reload)
latent_noise: 0.1        # train-time Gaussian noise on the latent (× its global std) -> f_z invariant to jitter
early_stop_patience: 8   # stop after this many report intervals w/o val-loss improvement; deploy the best checkpoint (0 = off)
val_frac: 0.15           # held-out fraction, split BY CLIP (no per-step leakage)
seed: 0
text_model: sentence-transformers/paraphrase-MiniLM-L3-v2
paraphrases: ["{c}", "the {c} band", "a {c} surface", "the {c} floor"]   # {c} -> the bucket name
