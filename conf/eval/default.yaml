action_dist_window: 4      # +/-N timesteps pooled per frame/tile across ALL action-dist products (pooled-magnitude
#                            animation, by-state, AND the per-dim marginals video) -> ~(2N+1)x samples/frame past the
#                            #episodes ceiling; the dist changes slowly so bias is tiny. ONE knob for all of them (the
#                            viz styling is shared too). 0 = no pooling (per-timestep). Change here -> changes both.
action_dist_episodes: 64   # LOCKED (user, 2026-07-20): action-distribution eval uses 64 val episodes (the full
#                            split) for DENSE histograms (~256/bin with window pooling). NEVER lower this — a
#                            lower value made the plots look sparse (n~30). DO NOT CHANGE / do not override lower.
horizon: 2048              # long-horizon / ood rollout length (capped by episode length); image heads roll it too
n_episodes: 64             # episodes averaged per OOD open-loop eval (proprio-only; image heads use 8, decode cost)
n_plot: 1                  # per-episode trajectory plots+videos+error curves per eval split (just _0)

# denoising eval (diffusion only): which trajectory + swarm angle it shows, and the multistep render cost
denoising_seed: null       # null -> use the epoch step (a DIFFERENT trajectory/angle each eval); set an int to pin one
denoising_max_steps: null  # null -> full 128 sequential swarms (~25min render); lower it to speed the multistep render

# evals that run *during training* (train/val happen normally regardless). flip any to true; the
# enabled routines are cycled through on every eval epoch.
during_train:
  # DECIDED (user, 2026-08-03): eval cadence is {5, 10, 15, 20, 30, 40, 50, ...} — denser early (every 5 up to
  # 20) then every 10, so late-training collapse (observed past ep20) is actually caught. DO NOT add per-epoch
  # early points like [1,3] (that made eval effectively "every 2" and clogged training).
  every_epochs: 10         # regular cadence: eval at 10, 20, 30, 40, 50, ... (SKIP 0); 0 disables the cadence
  at_epochs: [5, 15]       # extra early one-offs, UNIONED with the cadence -> {5, 10, 15, 20, 30, 40, 50, ...}
  evals:
    ood_horizon: true      # long-horizon open-loop rollout (OOD vs the short training horizon)
    ood_visual: false      # open-loop on the visual-OOD split (texture shift)
    ood_geometric: false   # open-loop on the geometric-OOD split (R, r shift)
    ood_dynamics: false    # open-loop on the dynamics-OOD split (gamma/a_max/mass shift)
    control: true          # dual MPPI control (oracle vs learned) through 8 goals (eval_control)
    denoising_multistep: true  # diffusion ONLY: fixed-agent sequential-swarm flow-field video (self-skips for other models)
    denoising_aggregate: true  # diffusion ONLY: pooled next-states collapsing from noise onto the manifold (self-skips)
    manifold: true         # ANY method: recovered-manifold UMAPs (data + latent space, 2D + 3D)
    interpret: false       # OFF in the train loop (user, 2026-08-05). VLM-labeled latent manifolds; needs
    #                        OPENAI_API_KEY + conf/interpret/<env>.yaml and ~20-30 min + OpenAI $ per eval epoch.
    #                        Run POST-HOC standalone: python -m quickdraw.eval_interpret checkpoint=<run>.
    action_distribution: true   # ON (user, 2026-08-05): whenever the action head is trained (model.action_head.
    #                             enabled=true, e.g. the joint runs) this eval reports learned-prior vs true data
    #                             action distribution. The routine SELF-SKIPS when there's no action head
    #                             (routines.py: action_head_enabled), so it's a safe default for post-hoc/no-head runs too.
    #                             NOTE (detach): these products reflect model.action_head.detach_gradient — our runs use
    #                             FALSE (NOT detached: the action-flow gradient flows INTO the trunk, the detachF setting
    #                             that beat detachT on every axis). So the prior is co-trained with the dynamics, not read
    #                             off a stop-grad head; flip detach_gradient=true and the prior no longer shapes the trunk.
    # (image FPV rollout/filmstrip/metrics are now part of ood_horizon — under eval_ood_horizon/<head>/)
