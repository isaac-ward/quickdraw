action_dist_window: 4      # +/-N timesteps pooled per frame/tile across ALL action-dist products (pooled-magnitude
#                            animation, by-state, AND the per-dim marginals video) -> ~(2N+1)x samples/frame past the
#                            #episodes ceiling; the dist changes slowly so bias is tiny. ONE knob for all of them (the
#                            viz styling is shared too). 0 = no pooling (per-timestep). Change here -> changes both.
action_dist_episodes: 64   # LOCKED (user, 2026-07-20): action-distribution eval uses 64 val episodes (the full
#                            split) for DENSE histograms (~256/bin with window pooling). NEVER lower this — a
#                            lower value made the plots look sparse (n~30). DO NOT CHANGE / do not override lower.
horizon: 2048              # long-horizon / ood rollout length (capped by episode length); image heads roll it too
closed_loop_steps: [1, 16] # eval_ood_horizon extra modes: re-inject the GROUND-TRUTH obs as context every X steps
#                            (X in this list) -> products under eval_ood_horizon/closed_loop_<X>_steps/ alongside
#                            eval_ood_horizon/open_loop/. Env-agnostic.
closed_loop_horizon: 256   # caps the rollout horizon for the CLOSED-LOOP modes ONLY (open_loop keeps the full
#                            `horizon`). The closed-loop error-vs-step signal is stationary/periodic (it resets every
#                            X steps), so a shorter horizon captures it; and cl_1 at full H is n_ep*H context-encodes
#                            = slow. Set null/0 to use the full `horizon` for closed-loop too.
n_episodes: 64             # episodes averaged per OOD open-loop eval (proprio-only; image heads use 8, decode cost)
ae_floor_episodes: 2       # val trajectories for eval_ae_floor (the encode->decode ceiling; #12). Cheap -> keep small.
decode_chunk: 64           # eval_ood_horizon decodes the rolled-out latents to images in chunks of this many
#                            timesteps so the U-Net decoder peak is bounded (batch x chunk), NOT batch x horizon
#                            -> long-horizon image eval doesn't OOM (PR #8 bug 2). null/0 -> decode whole rollout.
n_plot: 2                  # per-episode trajectory plots+videos+filmstrips per eval routine (_0.._{n-1}); SAME
#                            episode indices across eval_ood_horizon's open_loop + every closed_loop_X mode.
denoising_filmstrip_steps: 8   # K Euler steps for the denoising_filmstrip eval — set LOCALLY (not inherited from
#                                diffusion.sampling_steps/shortcut) so a K=1 (shortcut) training config still shows a
#                                multi-panel trajectory. Columns of each strip = [GT, noise, step 1..K].
# Two AXES for the filmstrip: `images` = how many DIFFERENT frames, each emitted as its OWN file
# eval_flow/denoising_filmstrip_<i>; `seeds` = eps-noise ROWS within each file (the generative spread on one frame).
denoising_filmstrip_images: 4  # number of different (episode, step) frames -> 4 separate files _0.._3
denoising_filmstrip_seeds: 4   # DEPRECATED (2026-08-24): the filmstrip's rows are now ROLLOUT HORIZONS, not eps
#                                seeds. A well-conditioned flow converges to the same answer from any eps, so the
#                                seed rows were near-duplicates. Kept only so old configs still compose.
denoising_filmstrip_horizons: [1, 8, 16, 32, 64]   # ROWS: open-loop rollout depth at which to show the flow's
#                                refinement. Reading DOWN tests whether refinement survives compounding; reading
#                                ACROSS (k1..kK) tests whether it refines at all. Also logged as scalars
#                                eval_flow/filmstrip/psnr/h<h>/k<k> -- trust those over the pictures, because the
#                                intermediate latents are off-manifold for a decoder trained only on clean ones.

# denoising eval (diffusion only): which trajectory + swarm angle it shows, and the multistep render cost
denoising_seed: null       # null -> use the epoch step (a DIFFERENT trajectory/angle each eval); set an int to pin one
denoising_max_steps: null  # null -> full 128 sequential swarms (~25min render); lower it to speed the multistep render

# evals that run *during training* (train/val happen normally regardless). flip any to true; the
# enabled routines are cycled through on every eval epoch.
during_train:
  # DECIDED (user, 2026-08-03): denser early then every-10 so late-training collapse (past ep20) is caught.
  # DO NOT add per-epoch early points like [1,3] (that made eval effectively "every 2" and clogged training).
  # PHASE (2026-08-09): the cadence fires on Lightning's (epoch+1)%every phase — the SAME phase as validation
  # (check_val_every_n_epoch) + the checkpoint — so each eval epoch coincides with a fresh val + ckpt (epoch 0
  # skipped). So every_epochs=10 -> {9,19,29,...} (not {10,20,...}), unioned with at_epochs -> {5,9,15,19,29,...}.
  every_epochs: 10         # regular cadence: (epoch+1)%10==0 -> eval at 9, 19, 29, 39, ... (SKIP 0); 0 disables it
  at_epochs: [5, 15]       # extra one-off epoch INDICES (LITERAL, not phase-shifted), UNIONED with the cadence
  #                          -> {5, 9, 15, 19, 29, 39, ...}
  evals:
    ood_horizon: true      # long-horizon open-loop rollout (OOD vs the short training horizon)
    ood_visual: false      # open-loop on the visual-OOD split (texture shift)
    ood_geometric: false   # open-loop on the geometric-OOD split (R, r shift)
    ood_dynamics: false    # open-loop on the dynamics-OOD split (gamma/a_max/mass shift)
    control: true          # dual MPPI control (oracle vs learned) through 8 goals (eval_control)
    denoising_multistep: true  # diffusion ONLY: fixed-agent sequential-swarm flow-field video (self-skips for other models)
    denoising_aggregate: true  # diffusion ONLY: pooled next-states collapsing from noise onto the manifold (self-skips)
    denoising_filmstrip: true  # AUTO-ON for flow dynamics: per-eps rows of [GT | noise | denoise step 1..K] image panels
    #                            showing the predicted next FRAME resolve over diffusion time. SELF-SKIPS unless the model
    #                            is MultiModalFlow with an image head, so true = on whenever the dynamics is flow, silently
    #                            skipped otherwise. Env-agnostic (no geometry) -> the first eval_flow product usable on a
    #                            recorded dataset. See knobs below.
    ae_floor: true         # encode->decode CEILING (no dynamics), per modality (#12). Bounds every image metric;
    #                        the flat error-vs-step curve reads as the floor vs ood_horizon's compounding rollout.
    manifold: true         # ANY method + ANY obs_dim: recovered-manifold UMAPs of the flattened LATENT bag (2D+3D).
    #                        Dimension-agnostic — uses only latents (width n_state*d), no ecfg/geometry — so it's
    #                        SAFE on any recorded dataset (torus or not); don't disable it for non-torus data (#9).
    interpret: false       # OFF in the train loop (user, 2026-08-05). VLM-labeled latent manifolds; needs
    #                        OPENAI_API_KEY + conf/interpret/<env>.yaml and ~20-30 min + OpenAI $ per eval epoch.
    #                        Run POST-HOC standalone: python -m quickdraw.eval_interpret checkpoint=<run>.
    action_distribution: true   # ON (user, 2026-08-05): whenever the action head is trained (model.action_head.
    #                             enabled=true, e.g. the joint runs) this eval reports learned-prior vs true data
    #                             action distribution. The routine SELF-SKIPS when there's no action head
    #                             (routines.py: action_head_enabled), so it's a safe default for post-hoc/no-head runs too.
    #                             NOTE (detach): these products reflect model.action_head.detach_gradient — our runs use
    #                             FALSE (NOT detached: the action-flow gradient flows INTO the trunk, the detachF setting
    #                             that beat detachT on every axis). So the prior is co-trained with the dynamics, not read
    #                             off a stop-grad head; flip detach_gradient=true and the prior no longer shapes the trunk.
    # (image FPV rollout/filmstrip/metrics are now part of ood_horizon — under eval_ood_horizon/<head>/)
