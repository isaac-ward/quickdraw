root: null     # set to the data_generation run dir, e.g. data.root=logs/data_generation_<ts>_<exp>
hf_repo: null  # null -> load from the local data.root; set to <namespace>/<name> to download+cache the
#                HF dataset repo (the whole run folder) and load from there.
repo_id: torus # lerobot repo prefix the splits were WRITTEN with (<repo_id>/<split>); recorded datasets
#                use their recording name (e.g. flightroom_starling)
cam: fpv       # camera stream name -> videos/observation.images.<cam> (torus: fpv; recorded starling: ego)
P: 8           # past context steps fed before prediction starts (obs already carries velocity, so
               # the state is near-Markov -> little history needed; P need NOT equal F)
F: 64          # future horizon rolled out during training (sets the BPTT length, not test horizon)
window_stride: 1   # LOCKED at 1 (user, 2026-07-20): NEVER use window_stride > 1. It skips training-window starts
                   # (e.g. 8 = only every 8th start -> 8x fewer batches/epoch); the user does not want this speed
                   # shortcut — always full dense coverage (stride 1). DO NOT CHANGE.
boundary_frac: 0.0   # TRAIN-only window enrichment: duplicate windows whose supervised region contains an
#                      action-dim-0 (setpoint) change so they form ~this fraction of an epoch. 0 = OFF
#                      (bit-identical). Every window still appears >= once (a SUPERSET of dense coverage —
#                      distinct from the LOCKED window_stride, which would REMOVE starts). Added for the
#                      xtcav run-3 response-surface work (critic-reviewed): scan-step boundaries are ~7-11%
#                      of windows and carry the entire knob->beam response signal.
boundary_sign_dim: null  # v5 (xtcav run 6, record §8.1): OPTIONAL extra enrichment triggers on this action
#                          dim — a SIGN change or a physical |delta| > boundary_delta (evaluated on
#                          DENORMALIZED values). null = OFF (bit-identical for every other dataset).
boundary_delta: 0.0
subsample: 1   # FRAME stride: keep every Nth frame and AGGREGATE the actions across the skipped ones. 1 = OFF
               # = bit-identical. NOT window_stride (above): that thins window STARTS and is locked; this thins
               # the frames INSIDE every window, i.e. it changes the physical timestep the dynamics models.
               #
               # WHY IT EXISTS (2026-08-12, record §13): robocasa is 20 Hz, and at 20 Hz the true per-step image
               # change is 0.0389 RMSE against the frozen TAESD's OWN 0.0637 reconstruction RMSE. The motion we
               # ask the dynamics to predict is 0.61x the NOISE FLOOR of the codec it predicts through, and only
               # 3.18% of pixels move more than that error. Predicting zero motion is therefore the CORRECT
               # solution to the objective -- which is what every run did (motion_ratio 0.13-0.17), and why
               # stronger action conditioning changed nothing. Measured against stride:
               #     stride 1 (20 Hz): delta 0.0389 = 0.61x floor | action R2 0.0062, timing worth 0.0002
               #     stride 5  (4 Hz): delta 0.0864 = 1.36x floor | action R2 0.0293, timing worth 0.0078
               # so 5 flips SNR above 1, raises the action's explanatory power 4.7x and the value of correct
               # action TIMING 39x, makes F=64 span 16 s instead of 3.2 s, AND costs 5x less per epoch.
               # Every published robot world model that controls long rollouts subsamples: V-JEPA-2-AC 4 fps
               # with integrated EEF deltas (2506.09985), HMA 2 Hz (2502.04296), IRASim ~4 fps (2406.14540).
               # Applied inside BOTH episode loaders (data/dataset.py) rather than threaded through their ~12
               # call sites, so eval can never silently run at a different rate than training.
batch: 1024    # fast baseline: 515K model + F=64 full BPTT fits ~51 GB at this batch. OVERRIDDEN at startup
               #   by the autobatch finder below (unless autobatch=false) — this is only the fallback/floor.
autobatch: true            # DEFAULT ON (2026-08-05): probe the AR step at startup + set data.batch to the
                           #   largest that fits VRAM*(1-headroom). The AR step is dispatch-bound so bigger
                           #   batch is ~free throughput (accelerations.md Exp 8). Set false for controlled
                           #   A/Bs that need a FIXED batch. Resumes keep their original batch (never re-probed).
autobatch_reserve_gb: 4    # ABSOLUTE margin (GB) held back from VRAM. The budget is
                           #     total - autobatch_reserve_gb - the GPU-RESIDENT FRAME STORE
                           #   where the frame store is MEASURED and subtracted by autobatch_find, because
                           #   MMWindowLoader parks it on the GPU AFTER sizing has already spent the card.
                           #
                           #   HISTORY, because two earlier rationales for this knob were wrong:
                           #   * It began as `autobatch_headroom`, a FRACTION. Deleted 2026-08-18 (not aliased,
                           #     so stale overrides fail loudly): a fraction of the card is the wrong shape for
                           #     a fixed-size phenomenon, being 10GB on a 40GB card and 25GB on a 100GB one.
                           #   * It was then justified as covering "allocator growth over a full epoch", sized
                           #     at 12GB from a "batch 112 probed 81GB then OOM'd at 93GB" incident. An audit on
                           #     2026-08-19 showed there is NO such growth: the probe-vs-real gap is entirely
                           #     the resident frame store (probe 87.29 + resident 3.17 = 90.46 against a real
                           #     90.29GB peak, residual 0.17GB), and that incident was most likely the same
                           #     frame store under the old allocator. With the term now explicit, 12 -> 4.
                           #   * Two other things it was said to cover are handled elsewhere: fragmentation is
                           #     measured (the probe budgets on max_memory_RESERVED -- worth only ~0.2% with
                           #     expandable_segments, not the 2-11% first reported, which was measured in the
                           #     wrong allocator), and the eval phase is probed and REPORTED, not gated.
                           #
                           #   4GB covers the ~0.3GB of window/index tensors the frame-store estimate omits,
                           #   plus slop. RAISE if a run OOMs late in an epoch; LOWER to fill the card further.
autobatch_max: 512         # cap (memory usually binds first for image models; this bounds proprio-only runs).
autobatch_base: 16         # smallest probe batch (assumed to fit).
workers: 16    # image mp4-decode is CPU-heavy; too few workers starves the GPU (low util). 80 cores here.
fast_gpu: true   # vector stage: hold all windows resident on GPU, batch by on-device index (no workers/copies)
n_plot_trajectories: 4     # how many sample trajectories to draw per split plot
fpv_fov: 100            # egocentric camera field of view (deg); VTK default is 30
composite_grid: 4         # NxN grid of per-episode FPV videos stitched per eval case
action_smooth_window: 18  # boxcar window (steps) for smoothing the action arrow in videos (less whippy)
action_sampler: ornstein_uhlenbeck   # ornstein_uhlenbeck (unimodal, default; deprecated alias: ou) | bimodal
#                           (two-basin action-magnitude process for the action-distribution experiment — see
#                           BimodalActionSampler) | random — torus-registered policies (environments/torus.py)

# All splits + every OOD change live here (env overrides applied on top of `environments/torus.yaml`).
# Each OOD axis changes exactly ONE thing:
#   visual    -> texture only (hsv -> hsv + grey squares)
#   geometric -> shape only (R, r), scaled to the base torus size
#   dynamics  -> motion only (gamma = velocity damping/drag [0 = frictionless, higher = more drag],
#                a_max = max action magnitude, mass = inertia)
splits:
  train:    {n_traj: 256, steps: 256,  seed: 0, coloring: hsv, env: {}}
  val:      {n_traj: 64,  steps: 256,  seed: 1, coloring: hsv, env: {}}
  eval_ood_horizon: {n_traj: 64,  steps: 1024, seed: 2, coloring: hsv, env: {}}   # the ONLY long-horizon split
  # the other OOD axes use the SAME horizon as train/val (256) so each isolates its own shift, not length
  eval_ood_visual:    {n_traj: 64, steps: 256, seed: 3, coloring: circles, env: {}}
  eval_ood_geometric: {n_traj: 64, steps: 256, seed: 4, coloring: hsv, env: {R: 1.1, r: 0.08}}
  # OOD dynamics = much SLOWER physics (base is fast now): 5x friction + ~3.3x mass (action range unchanged)
  eval_ood_dynamics:  {n_traj: 64, steps: 256, seed: 5, coloring: hsv, env: {gamma: 0.5, mass: 2.0}}
