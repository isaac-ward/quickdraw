root: null     # set to the data_generation run dir, e.g. data.root=logs/data_generation_<ts>_<exp>
P: 8           # past context steps fed before prediction starts (obs already carries velocity, so
               # the state is near-Markov -> little history needed; P need NOT equal F)
F: 64          # future horizon rolled out during training (sets the BPTT length, not test horizon)
window_stride: 1   # TRAIN windows: 1 = every start (dense, redundant — adjacent windows overlap L-1 steps);
                   # >1 strides the starts (e.g. 4 = 4x fewer batches/epoch, ~no coverage loss over many epochs). val stays 1.
batch: 1024    # fast baseline: 515K model + F=64 full BPTT fits ~51 GB at this batch
workers: 4
fast_gpu: true   # vector stage: hold all windows resident on GPU, batch by on-device index (no workers/copies)
n_plot_trajectories: 4     # how many sample trajectories to draw per split plot
fpv_fov: 100            # egocentric camera field of view (deg); VTK default is 30
composite_grid: 4         # NxN grid of per-episode FPV videos stitched per eval case
action_smooth_window: 18  # boxcar window (steps) for smoothing the action arrow in videos (less whippy)

# All splits + every OOD change live here (env overrides applied on top of `environments/torus.yaml`).
# Each OOD axis changes exactly ONE thing:
#   visual    -> texture only (hsv -> hsv + grey squares)
#   geometric -> shape only (R, r), scaled to the base torus size
#   dynamics  -> motion only (gamma = velocity damping/drag [0 = frictionless, higher = more drag],
#                a_max = max action magnitude, mass = inertia)
splits:
  train:    {n_traj: 256, steps: 256,  seed: 0, coloring: hsv, env: {}}
  val:      {n_traj: 64,  steps: 256,  seed: 1, coloring: hsv, env: {}}
  eval_ood_horizon: {n_traj: 64,  steps: 1024, seed: 2, coloring: hsv, env: {}}   # the ONLY long-horizon split
  # the other OOD axes use the SAME horizon as train/val (256) so each isolates its own shift, not length
  eval_ood_visual:    {n_traj: 64, steps: 256, seed: 3, coloring: circles, env: {}}
  eval_ood_geometric: {n_traj: 64, steps: 256, seed: 4, coloring: hsv, env: {R: 1.1, r: 0.08}}
  # OOD dynamics = much SLOWER physics (base is fast now): 5x friction + ~3.3x mass (action range unchanged)
  eval_ood_dynamics:  {n_traj: 64, steps: 256, seed: 5, coloring: hsv, env: {gamma: 0.5, mass: 2.0}}
