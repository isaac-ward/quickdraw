# =============================================================================================
# Cosmos on `data=block_stack`. Select with `model=cosmos_blockstack interpret=block_stack`.
#
# Two sizes, and they are not the same size. `modalities.img_size` is what the DATA is decoded at and
# what every metric is computed at: 144x192, as block-stack ships. `render_size` is what COSMOS runs at:
# 720x960, exactly 5x, so identical aspect and both axes divisible by 16, and the ABC's resample back for
# LPIPS is pure scaling. This is the MEASURED default -- see wizard/records/cosmos.md Finding 1b:
#
#     resolution   LPIPS @+1   @+64    SSIM @+64   motion_ratio @+1
#     144x192        0.477    0.839      0.198          4.10          <- saturated noise
#     720x960        0.041    0.218      0.730          1.35
#
# Override with `+external.height=... +external.width=...`; move both together.
#
# THE STRIDE IS PART OF THE MODEL SETUP HERE, not just a data knob. Cosmos makes ~5.8-second clips and
# takes 5 context frames; what makes those 5.8 s realistic is the SPACING of the frames we hand it.
# block-stack is 30 Hz, so:
#
#   data.subsample   we feed   declared fps   5 ctx frames span   93-frame clip   vs the 5.8 s design
#           8         3.75 Hz        4             1.33 s            23.3 s            4.0x   <- wrong
#           2        15.00 Hz       15             0.33 s             6.2 s            1.1x   <- right
#
# 30 does not divide by 16, so 15 Hz (stride 2) is as close to the model's native rate as this footage
# gets, and it lands the clip length on the design point. It costs 4x the pipeline calls for the same
# WALL-CLOCK horizon, and it means comparisons against our own model must be at matched SECONDS rather
# than matched step counts (our +128 at stride 8 is Cosmos's +512 at stride 2 -- both 34 s).
#
#   python -m quickdraw.eval_ood_horizon model=cosmos_blockstack interpret=block_stack \
#       data=block_stack environments=recorded data.subsample=2 data.action_aggregate=concat
#
# data.P=8 with Predict2's 4x temporal VAE gives Cosmos 5 of the 8 context frames (see
# models/external_cosmos.py). data.P=9 gives it all 9 and costs one frame of dataset window.
# =============================================================================================
defaults:
  - cosmos
  - _self_

render_size: [720, 960]

modalities:
  - {name: image, kind: image, weight: 1.0, img_size: [144, 192], ae_bottleneck: 9, pretrained: false}
