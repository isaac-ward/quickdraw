name: base
d: 96                     # ~515K params at depth 4 (the fast baseline config)
depth: 4
heads: 6                  # head_dim = d/heads = 16 (power of 2, FlexAttention requires that)
window: 64               # attention span: each step attends to the last `window` steps
mlp_ratio: 4.0
rope_theta: 10000.0

# teacher-forcing curriculum: p_tf is LINEARLY ramped start -> end over the first warmup epochs,
# then held at end. p_tf is the per-step prob of feeding the TRUE next obs instead of the model's
# own prediction during the training rollout (1 = full teacher forcing, 0 = pure autoregression).
p_tf_start: 1.0          # epoch 0: full teacher forcing (cheap parallel pass, stable cold start)
p_tf_end: 0.0            # after warmup: pure autoregression (model consumes its own predictions)
p_tf_warmup_epochs: 4    # epochs to ramp over; set == 0 to pin p_tf at p_tf_end (no curriculum)

# backprop-through-time in the rollout: detach the fed-back obs every N steps so gradients don't flow
# across rollout steps. 1 = BPTT OFF (detach every step; cheapest, default for initial runs);
# 8 = truncated BPTT in 8-step segments; 0 = full BPTT through the whole rollout (most expensive).
detach_every: 0    # FULL BPTT through the whole rollout (gradients flow across all F steps)
