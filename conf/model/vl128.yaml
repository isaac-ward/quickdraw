# =============================================================================================
# vl128 — vl64 with the NARROW transition head, and the pixel/perceptual terms at parity.
# Best-known recipe on robocasa-scene4-4h as of 2026-09-01. Select with `model=vl128`.
# See wizard/records/robocasa-scene4-4h.md section 23.
#
# TWO CHANGES from vl64, and they are NOT equally proven. Read this before quoting the recipe:
#
#   1. `diffusion.flow_hidden: 128`  -- PROVEN. This is the change that FIXED THE COLLAPSE.
#      Every L1+LPIPS run at flow_hidden=512 destroyed itself between eval 5 and eval 12
#      (vl_keep10 ev12, vl_lp025 ev9, dec_inject ev5) and vl_keep10 sat dead from ev12 to ev15.
#      `st_fh128` is identical to vl_keep10 except this one number: it sailed through ev12 and was
#      STILL SETTING RECORDS at ev15. It holds every all-time best on this dataset:
#            OL LPIPS@+128  0.1315 (ev15)   vs 0.2392 pre-LPIPS   -- 45% better
#            codec floor    0.0887 (ev15)   vs 0.1432 pre-LPIPS   -- 38% better
#            floor PSNR     19.49 dB at a sub-0.09 perceptual floor (the pure-MSE runs reached
#                           19.6 dB but only at floor 0.17)
#
#   2. `visual_l1: 3.0`  -- PROMISING AT 6 EVALS, NOT PROVEN. vl64's 1.0/1.0 LOOKS balanced and is
#      not: measured on the trained codec L1 = 0.0587 and LPIPS-vgg = 0.1835, a 3.13:1 ratio, so the
#      objective is 24% pixel / 76% perceptual. At 3.0 it is 49/51. Say "weighted 3:1 so the two
#      terms contribute equally, measured on the trained codec" -- do NOT write 3.13, the third digit
#      is one measurement on one checkpoint and the ratio drifts more than 4% over training.
#      At matched eval 4 against st_fh128 (l1=1.0), everything else identical:
#            floor 0.1027 vs 0.1056 | floor PSNR 18.82 vs 18.48 | @+128 0.1628 vs 0.1598
#            latent_cos 0.523 vs 0.295   <-- and 0.523 is the highest latent_cos EVER on this dataset
#      Better reconstruction and far better angular tracking for 0.003 of @+128, which is well inside
#      the 0.02-0.08 per-epoch jitter. But SIX EVALS. If you need the safest configuration rather than
#      the most promising one, set `visual_l1: 1.0` and you have st_fh128 exactly.
#
# WHY l1=3 EXISTS AT ALL -- the user saw it before any metric did. They reported the frames looked
# "perceptually weird af" while every number said the run was the best in the project's history.
# Measured (`_oneoff_colour_cast.py`, 128 val frames, real encode->decode):
#     dyn512 (pure L2)      channel bias -0.0018/-0.0017/-0.0007  spread 0.0011  saturation 0.985
#     vl_keep10 (L1+LPIPS)  channel bias +0.0024/-0.0026/+0.0018  spread 0.0050  saturation 1.100
# IDENTICAL MAE (0.0584 vs 0.0567), differently SHAPED error: a magenta cast and 10% OVERSATURATION.
# LPIPS scores VGG features after several pooling stages, so a global colour shift barely moves it and
# oversaturating makes edges "pop" in feature space almost for free. The pixel term is the only thing
# pinning absolute colour, and at 1.0 it carried a quarter of the objective.
#
# THREE THINGS THAT WERE TRIED AND LOST, so nobody re-runs them:
#   * `visual_lpips: 0.25` (lower the perceptual share instead of raising the pixel share) -- floor
#     0.2317 vs 0.0945, and its encoder gradient sat at 0.005-0.03 for FOUR epochs, 100x below normal,
#     before lurching to 7.96 and dying at ev9. Lowering lpips also lowers TOTAL loss and therefore
#     codec pressure; raising l1 does not.
#   * adding L2 back -- killed on arithmetic, not opinion. A systematic 0.0025 bias against a 0.058
#     per-pixel error is 4% of it under L1 and NEGLIGIBLE under L2 (b^2). No squared term fixes a
#     small global cast at any sane weight, and it drags the loss back toward the blur regime.
#   * `detach_every: 8` (from 32, to shorten the exploding Jacobian product) -- FROZE the model
#     instead: grad/norm/flow fell to 0.096 against the ~0.29 reference, motion_ratio to 0.018, and it
#     died at ev9, THREE EVALS EARLIER than the base it was meant to protect. This is exactly the
#     vanishing-Jacobian mode record section 19 warned about. Leave detach_every at 32.
#
# ALSO DO NOT MOVE `latent_loss_weight` (inherited 10). Bracketed on both sides: 0.4 erased the codec
# 5.4 dB in ONE epoch, 25 froze motion to 0.02 with negative latent_cos and inf gradients.
#
# HONEST CAVEATS THAT SURVIVE ALL OF THE ABOVE:
#   * TRAIN ON VGG, EVALUATE ON SQUEEZE, and keep it that way. `_lpips_net` still defaults to squeeze
#     for the reported metric; training on that same network would optimise the metric's own features
#     and make the number incomparable to the 25 pre-LPIPS runs. The backbones are correlated anyway
#     (vgg/squeeze drifted 1.713 -> 1.780 as vl_keep10 trained), so READ PSNR/SSIM AND THE FRAMES too.
#   * The rollout is still the weaker half. At matched eval, OL PSNR sits ~13.7-13.8 where the old
#     pure-MSE narrow-head run (`dec_up64`) reached 14.9-15.4. The autoencoder improved far more than
#     the dynamics did.
#   * `flow_hidden=512` was NOT a wasted experiment -- it won @+128 by a hair over `dec_up64`
#     (0.2392 vs 0.2429) under the pure-MSE loss. It is under the L1+LPIPS loss that it becomes fatal.
# =============================================================================================
defaults:
  - vl64
  - _self_

diffusion:
  # THE change. 128 = the model dimension d, i.e. the stock width; 512 was an explicit widening that
  # won marginally under pure MSE and reliably self-destructs under the perceptual loss.
  flow_hidden: 128

modalities:
  # Restated in full: OmegaConf REPLACES lists rather than merging them, so inheriting vl64 and editing
  # one entry is impossible -- and being explicit is what makes the recipe auditable.
  - {name: proprio, kind: vector, dim: 6, weight: 1.0, decode_kind: flow, decode_param: x0, decode_arch: mlp}
  - {name: image, kind: image, weight: 1.0, img_size: 128,
     pretrained: false,
     num_tokens: 32,
     encode_arch: conv,
     encode_base: 32,
     decode_kind: mse,
     decode_arch: up,
     decode_base: 64,
     decode_param: x0, patch: 16, ae_depth: 4,
     decode_chunk_train: 64,
     visual_l1: 3.0,          # <-- parity with the perceptual term (measured 3.13:1, rounded). Set 1.0
     #                              to reproduce st_fh128, which is the more-proven configuration.
     visual_l2: 0.0,          # deliberately absent -- see the "tried and lost" note above.
     visual_lpips: 1.0,
     visual_lpips_net: vgg,   # TRAINING backbone. Never "squeeze": that is the REPORTED metric's.
     visual_frames: 128,
     latent_loss_weight: 10}  # DO NOT MOVE -- bracketed on both sides.

# NOT covered here (a model config cannot hold them) -- pass on the CLI, as vl64/up64 document:
#   data.subsample=<k>   data.F=64   model.action_dim / modalities.0.dim / environments.*
#   model.modalities.1.img_size=96  +model.modalities.1.ae_bottleneck=6   <- PAIR THESE
#   data.autobatch=false data.batch=26   <- every number quoted above used batch 26; autobatch would
#                                           pick a larger one now that the flow head is 4x narrower,
#                                           which would silently add a second variable.
