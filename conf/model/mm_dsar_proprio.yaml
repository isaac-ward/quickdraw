# Proprio-only MultiModalDSAR — data-space AR, image modality removed (baseline for the vision comparison).
name: mm_dsar
d: 32
depth: 4
heads: 8
window: 32
mlp_ratio: 4.0
rope_theta: 10000.0
action_dim: ${data.schema.action_dim}
p_tf_start: 1.0
p_tf_end: 0.0
p_tf_warmup_epochs: 4
recon_frac: 1.0            # fraction (0-1) of the F rollout frames to supervise the decode recon on (train only;
                           #   ALL output modalities, same random subset per step). 1.0=all. <1 saves ViT-AE decode compute.
detach_every: 8
modalities:
  - {name: proprio, kind: vector, dim: '${data.schema.state_dim}', weight: 1.0, noise_std: 0.0}
