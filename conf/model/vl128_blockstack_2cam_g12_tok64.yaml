# vl128_blockstack_2cam + FINER GRID + MORE MENU (Ceiling-A codec fix, 2026-09-27).
# ae_bottleneck 6 -> 12 (readout 6x8 -> 12x16, 192 cells) AND num_tokens 32 -> 64. With the finer
# readout the 32-token bottleneck falls to ~17% of readout cap, so this arm tests whether a finer grid
# needs a richer latent to feed it (num_tokens matters ONLY paired with a finer grid, never alone --
# tok64 alone did nothing at the 6x8 grid). OmegaConf REPLACES lists -> modalities restated in full.
defaults:
  - vl128_blockstack_2cam
  - _self_

modalities:
  - {name: proprio, kind: vector, dim: 17, weight: 1.0, decode_kind: flow, decode_param: x0, decode_arch: mlp}

  - {name: cam_scene, kind: image, cam: scene_right,
     weight: 1.0,
     img_size: [96, 128],
     ae_bottleneck: 12,
     pretrained: false, num_tokens: 64,
     encode_arch: conv, encode_base: 32,
     decode_kind: mse, decode_arch: up, decode_base: 64,
     decode_param: x0, patch: 16, ae_depth: 4, decode_chunk_train: 64,
     visual_l1: 3.0, visual_l2: 0.0, visual_lpips: 1.0, visual_lpips_net: vgg, visual_frames: 128,
     latent_loss_weight: 10}

  - {name: cam_wrist, kind: image, cam: gripper_right_top,
     weight: 1.0,
     img_size: [96, 128],
     ae_bottleneck: 12,
     pretrained: false, num_tokens: 64,
     encode_arch: conv, encode_base: 32,
     decode_kind: mse, decode_arch: up, decode_base: 64,
     decode_param: x0, patch: 16, ae_depth: 4, decode_chunk_train: 64,
     visual_l1: 3.0, visual_l2: 0.0, visual_lpips: 1.0, visual_lpips_net: vgg, visual_frames: 128,
     latent_loss_weight: 10}
