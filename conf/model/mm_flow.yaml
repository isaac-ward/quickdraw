name: mm_flow
d: 32                     # backbone/token width (all modality tokens live at d)
depth: 4
heads: 8                   # head_dim = 4 (d/heads; power of 2 for FlexAttention)
window: 32                 # temporal attention span
mlp_ratio: 4.0
rope_theta: 10000.0
action_dim: 2
lambda_flow: 1.0
lambda_consistency: 1.0
# TEACHER-FORCING SCHEDULE — p_tf ramps p_tf_start -> p_tf_end over p_tf_warmup_epochs.
# EMPIRICAL FINDING (2026-07, bimodal data) — DO NOT REGRESS THIS DEFAULT:
#   p_tf_end=0.0 (IN-ROLLOUT: dynamics trains on its OWN predictions) is the WORKING default. It prevents the
#   autoregressive MEAN-COLLAPSE (proprio->origin, images->one frozen frame) that full teacher-forcing causes:
#   under p_tf_end=1.0 the dynamics NEVER sees its own errors, so at rollout it drifts to the unconditional-mean
#   attractor (val flow/latent 4-8, encode_image grad spikes ~4.34). In-rollout: val 0.81->0.32, pointwise 0.61.
#   Diffusion Forcing (variations.noise_injection.observations_encoded_pre_fusion.scale) is NOT a substitute —
#   at scale 0.25/1.0 it made collapse WORSE (train-noised/val-clean 1-step mismatch) and DF-alone eventually
#   NaNs under full TF; IWS's 0.1 stayed stable but still needs in-rollout for the residual drift. So: keep
#   p_tf_end=0.0 (in-rollout), keep DF scale=0.0 (off). The anti-collapse lever is in-rollout, not DF.
p_tf_start: 1.0
p_tf_end: 0.0
p_tf_warmup_epochs: 4
dynamics_detach_encoder: false   # true -> stop-grad the encoded context feeding the DYNAMICS (flow/latent) loss:
#                           the dynamics gradient can't reshape the encoder (trained then only by decode/recon).
#                           The joint-training equivalent of IWS's frozen AE (anti-collapse). See multimodal.py.
recon_frac: 1.0            # fraction (0-1) of the F rollout frames to supervise the decode recon on (train only;
                           #   ALL output modalities, same random subset per step). 1.0=all. <1 saves ViT-AE decode compute.
detach_every: 16
# Temporal KV-cache is ON by default for INFERENCE rollouts (imagine_eval / MPPI; MultiModalSequenceModel.
# use_kv_cache, never used in training). It is the FAITHFUL sliding-window forward (cached == full-sequence
# masked forward, ~8e-7). NOTE: it also (correctly) un-truncates deep-layer receptive fields that the legacy
# per-step rollout truncated at the window's left edge -> for horizon > window the cached rollout differs
# slightly (~0.02 on decoded obs) from the pre-cache path. Within window it is identical. See smoke/kvcache.py.
diffusion:
  shortcut: false          # true -> K=1 sampling via self-consistency
  sampling_steps: 6
  predict: residual
  stochastic_eval: false   # false -> eps=0 committed prediction at eval
  time_sampling: uniform
  flow_hidden: 0           # 0 -> mirror d
# action-distribution head (design/models/flow_heads.md — the action-flow prior). A FlowField that predicts
# the NEXT action's distribution from the PREVIOUS-step backbone context h[t-1] (leak-free: it never sees the
# action a[t] it predicts, only history). Trained JOINTLY as an extra flow loss; it is a learned behavior/play
# prior used LATER as the MPPI proposal — its samples are NEVER fed back into the world model. Eyeballed via the
# eval_action_distribution routine (true-vs-pred histograms + animation). enabled: false -> no head, bit-identical.
action_head:
  enabled: false            # true -> add the action-flow head + loss/flow/action (+ loss/shortcut/action)
  weight: 1.0               # weight of the action-flow loss in the total training loss
  shortcut: true            # K=1 sampling (fast MPPI proposal); like the dynamics diffusion.shortcut
  detach_gradient: false    # false (default) = the action-head gradient flows into the rest of the model, so the
  #                           action task co-shapes the WM trunk during joint training; true = the gradient is
  #                           DETACHED from the trunk, so the action head learns off a frozen context and cannot
  #                           reshape the shared representation (a non-interfering probe)
modalities:
  # decode_kind: flow -> generative decode head per trunk (design/models/flow_heads.md). mse (default) =
  # deterministic decode, bit-identical to before. decode_shortcut: true -> K=1 sampling (EXPLICIT opt-in, like
  # the dynamics `diffusion.shortcut`; shortcut is never default-on). Starting BOTH trunks on flow to validate cross-trunk.
  - {name: proprio, kind: vector, dim: 6, weight: 1.0, decode_kind: flow, decode_param: x0, decode_arch: mlp}
  - {name: image, kind: image, num_tokens: 8, img_size: 128, patch: 16, ae_depth: 4, weight: 1.0, decode_kind: flow, decode_param: x0, encode_arch: vit, decode_arch: vit}
