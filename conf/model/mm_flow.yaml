name: mm_flow
d: 32                     # backbone/token width (all modality tokens live at d)
depth: 4
heads: 8                   # head_dim = 4 (d/heads; power of 2 for FlexAttention)
window: 32                 # temporal attention span
mlp_ratio: 4.0
rope_theta: 10000.0
action_dim: 2
lambda_flow: 1.0
lambda_consistency: 1.0
p_tf_start: 1.0
p_tf_end: 0.0
p_tf_warmup_epochs: 4
recon_frac: 1.0            # fraction (0-1) of the F rollout frames to supervise the decode recon on (train only;
                           #   ALL output modalities, same random subset per step). 1.0=all. <1 saves ViT-AE decode compute.
detach_every: 16
# Temporal KV-cache is ON by default for INFERENCE rollouts (imagine_eval / MPPI; MultiModalSequenceModel.
# use_kv_cache, never used in training). It is the FAITHFUL sliding-window forward (cached == full-sequence
# masked forward, ~8e-7). NOTE: it also (correctly) un-truncates deep-layer receptive fields that the legacy
# per-step rollout truncated at the window's left edge -> for horizon > window the cached rollout differs
# slightly (~0.02 on decoded obs) from the pre-cache path. Within window it is identical. See smoke/kvcache.py.
diffusion:
  shortcut: false          # true -> K=1 sampling via self-consistency
  sampling_steps: 6
  predict: residual
  stochastic_eval: false   # false -> eps=0 committed prediction at eval
  time_sampling: uniform
  flow_hidden: 0           # 0 -> mirror d
modalities:
  # decode_kind: flow -> generative decode head per trunk (design/models/flow_heads.md). mse (default) =
  # deterministic decode, bit-identical to before. decode_shortcut: true -> K=1 sampling (EXPLICIT opt-in, like
  # the dynamics `diffusion.shortcut`; shortcut is never default-on). Starting BOTH trunks on flow to validate cross-trunk.
  - {name: proprio, kind: vector, dim: 6, weight: 1.0, decode_kind: flow, decode_param: x0}
  - {name: image, kind: image, num_tokens: 8, img_size: 128, patch: 16, ae_depth: 4, weight: 1.0, decode_kind: flow, decode_param: x0}
