name: mm_flow
# =============================================================================================
# BEST PERFORMANCE (2026-07-28, bimodal data) — this recipe RECREATES it, stably (no NaN/collapse).
# Runs repro_ptf0_{mse,flow}: this model + NO action head + warmup 4 reproduced AND beat the ptf0
# baseline. Metrics @ep10-15  (repro_mse | repro_flow | ptf0-target):
#     val img PSNR    18.9 | 18.3 | 19.1        OOD pointwise    0.24 | 0.32 | 0.36
#     OOD img PSNR    14.5 | 12.6 | 13.6        control goals/5  4.12 | 3.5  | 3.88
# KEYS TO RECREATE:
#   - action_head OFF (joint action head killed control ~0 vs 3.88 AND destabilized -> NaN/collapse).
#   - ViT-MSE image decode (decode_kind=mse, decode_arch=vit) slightly BEAT U-Net/flow on EVERY axis here.
#   - p_tf in-rollout (end 0.0), warmup 4 (control online by ep5; 10 delays it), DF off.
#   - NO conv encoder, NO num_tokens>8, NO grad-accum, NO window_stride>1, NO dynamics_detach/grad_ckpt.
#   FULL recipe (CLI overrides over these defaults): model.d=128 depth=4 heads=8 window=32 data.batch=32
#   data.F=64 recon_frac=0.25 diffusion.shortcut=true p_tf_warmup_epochs=4 detach_every=16
#   modalities.1.{num_tokens=8,encode_arch=vit,decode_arch=vit,decode_kind=mse}  action_head.enabled=false.
#   UPDATE 2026-08-06: the CURRENT defaults below differ from the 2026-07-28 recipe — detach_every=32 (the validated
#   point: less detach than det16 fixes the ~ep10 long-horizon control collapse), action_head.enabled=true (UNLOCKED; longer BPTT
#   rehabilitated the joint head), and IMAGE decode is now decode_kind=mse + decode_arch=unet (conv decoder, no patch
#   grid — UNTESTED on metrics, see the image note below). Recipe above = historical det16/vit best.
#   UPDATE 2026-08-07: IMAGE encode_arch is now CONV (was vit). The db16 encoder A/B (mini, decode_base=16,
#   runs 4mzoqi54 vit vs as92t39l conv) had conv edge vit on ~every image+dynamics metric at ep10/11 — val PSNR
#   17.4 vs 17.0, ckpt manifold_dist_err 0.086 vs 0.095, OOD PSNR 15.5 vs 14.3, OOD pointwise 0.222 vs 0.297 —
#   with a more stable latent-flow loss (vit's total val loss crept from the flow terms, not image recon).
# =============================================================================================
size: null                # null | tiny | small — ONE knob that sets the capacity levers below (d, image
#                           num_tokens, image decode_base) from setup.SIZE_PRESETS. Applied onto cfg before the
#                           resolved dump, so config.resolved records the real values. RAISES if you also override
#                           one of those knobs individually (use size OR the knobs, not both). Basic starting points.
d: 32                     # backbone/token width (all modality tokens live at d)
depth: 4
heads: 8                   # head_dim = 4 (d/heads; power of 2 for FlexAttention)
window: 32                 # temporal attention span
mlp_ratio: 4.0
rope_theta: 10000.0
action_dim: 2
lambda_flow: 1.0
lambda_consistency: 1.0
# TEACHER-FORCING SCHEDULE — p_tf ramps p_tf_start -> p_tf_end over p_tf_warmup_epochs.
# EMPIRICAL FINDING (2026-07, bimodal data) — DO NOT REGRESS THIS DEFAULT:
#   p_tf_end=0.0 (IN-ROLLOUT: dynamics trains on its OWN predictions) is the WORKING default. It prevents the
#   autoregressive MEAN-COLLAPSE (proprio->origin, images->one frozen frame) that full teacher-forcing causes:
#   under p_tf_end=1.0 the dynamics NEVER sees its own errors, so at rollout it drifts to the unconditional-mean
#   attractor (val dynamics/latent 4-8, encode_image grad spikes ~4.34). In-rollout: val 0.81->0.32, pointwise 0.61.
#   Diffusion Forcing (variations.noise_injection.observations_encoded_pre_fusion.scale) is NOT a substitute —
#   at scale 0.25/1.0 it made collapse WORSE (train-noised/val-clean 1-step mismatch) and DF-alone eventually
#   NaNs under full TF; IWS's 0.1 stayed stable but still needs in-rollout for the residual drift. So: keep
#   p_tf_end=0.0 (in-rollout), keep DF scale=0.0 (off). The anti-collapse lever is in-rollout, not DF.
p_tf_start: 1.0
p_tf_end: 0.0
p_tf_warmup_epochs: 1    # DEFAULT 1 (2026-08-07): with a decently-sized dataset (~4h+) one epoch is plenty of
#                          steps to anneal teacher forcing; the old default 4 suited the ~30-min toy torus set.
#                          Raise to ~4 for small datasets (fewer steps/epoch -> the ramp needs more epochs).
# NOTE (user, 2026-08-10): "affine is clearly right for a frozen AE where the latent scale is a fixed property
# of the data. For the bespoke learned AE the encoder can drift its own scale during training, and LN may be
# doing real work there. So the default probably needs to be per-modality, not global."
latent_norm: affine      # layernorm | affine | none. HOW the latent is made scale-free for the dynamics.
#                          LOCKED affine (user, 2026-08-10). DEFINITIVE TEST: tf_ln vs tf_affine, identical in
#                          every respect except this flag (transformer denoiser, 8x128 EXACT bag, frozen TAESD
#                          @128px, batch 32, stochastic eval) -- logs/robocasa-tfaff/*_19_36_25_tf_{ln,affine}.
#                          At epoch 0 affine won on EVERY axis:
#                            one-step PSNR      14.48  vs   8.78   (+5.7 dB)
#                            dynamics/latent   0.1977  vs  0.3935   (HALF the loss; every prior run sat ~0.29)
#                            codec/roundtrip   0.0034  vs  0.0058
#                            val loss total    0.5518  vs  1.3365
#                            motion_ratio       0.822  vs   2.060   (calibrated vs 2x jitter)
#                            ae_floor (codec)   24.92  vs  22.89
#                          The ae_floor number is the mechanism, not just a score: under affine the codec
#                          IMPROVES past its own 23.92 dB raw-AE floor (the adapter residual learns to
#                          pre-distort the latent so TAESD's decoder reconstructs better), whereas under
#                          layernorm it ERODES -- df_off went 23.52 -> 21.63 over four epochs with
#                          closed_loop_1_steps tracking it down 22.45 -> 21.13, i.e. one-step prediction was
#                          pinned to a ceiling training was destroying. Cause: the 3.51 dB LayerNorm tax is the
#                          ONLY reason the adapter residual must learn anything, and it shares its 0.134M
#                          params with the dynamics, which wins the tug-of-war. Remove the tax, remove the war.
#                          CAVEAT ON THE EVIDENCE: epoch 0 only, and epoch 0 is the p_tf=1.0 teacher-forced
#                          epoch. Strong and mechanistically explained, but not yet confirmed post-rollout.
#                          WE WANT THE DYNAMICS TO RECEIVE NORMALIZED TOKENS -- that requirement is LOCKED; only
#                          the MECHANISM is a choice. `none` is a research escape hatch, not a default.
#   layernorm  (default, and bit-identical to every run before 2026-08-10) per-token non-affine LayerNorm on the
#              carried bag, applied everywhere the bag is produced: encode_state, predict_next, and the
#              diffusion-forcing noised context. Scale-free and stable, but NOT invertible -- it discards each
#              token's mean and std (2 scalars per token), measured at -3.51 dB of reconstruction ceiling
#              (23.92 -> 20.41) on robocasa 128px + frozen TAESD. The adapter residual must learn those moments
#              back; loss/codec/roundtrip_<mod> supervises exactly that.
#   affine     fixed per-CHANNEL scale+shift on the AE LATENT, calibrated once from the training set at fit
#              start and inverted EXACTLY before decode. The dynamics still sees ~unit-variance inputs, but the
#              round trip is lossless, so it costs 0 dB. This is Stable Diffusion's `scaling_factor` (literally
#              the latent std) generalized per channel; modern video VAEs store latents_mean/latents_std the
#              same way. The bag itself is then left alone -- which also removes the padding hazard below and
#              makes the token layout irrelevant to reconstruction.
#   Active type + its parameters are logged to wandb under normalization/ and to progress.log as [latent_norm].
p_tf_batch_granular: false  # LOCKED false (2026-08-07). true = smooth p_tf ramp over a fractional epoch
#                            (current_epoch + batch_idx/num_batches); false = per-epoch step. LOCKED false because
#                            batch-granular is ~10x SLOWER during warmup: the step has three regimes — p_tf==1.0
#                            uses the fast PARALLEL forward, p_tf==0.0 uses the COMPILED rollout, and any
#                            0<p_tf<1 falls into the slow EAGER SEQUENTIAL AR rollout (F per-step dispatches, no
#                            compile). A smooth ramp sits in that slow zone for the ENTIRE warmup, so epoch 0 on
#                            a big dataset crawled (owm-iss: >5.6h and not even 25% vs ~30min at p_tf=1). Per-epoch
#                            keeps warmup epochs at p_tf=1.0 (fast parallel), then hard-switches to p_tf=0.0
#                            (compiled) — the hard 1->0 jump is a feature, not a bug, given the regime cost.
dynamics_detach_encoder: false   # true -> stop-grad the encoded context feeding the DYNAMICS (dynamics/latent) loss:
#                           the dynamics gradient can't reshape the encoder (trained then only by decode/recon).
#                           The joint-training equivalent of IWS's frozen AE (anti-collapse). See multimodal.py.
recon_frac: 1.0            # fraction (0-1) of the F rollout frames to supervise the decode recon on (train only;
                           #   ALL output modalities, same random subset per step). 1.0=all. <1 saves ViT-AE decode compute.
detach_every: 32           # DEFAULT 32 = truncate the rollout BPTT graph every 32 steps. LESS detach = longer
#                            penalized horizon = BETTER LONG-HORIZON stability/control: at detach_every=16 the one-step
#                            map drifted non-contractive and control collapsed to NON-FINITE ~ep10; 32 fixed it (stable
#                            through ep30+). 32 is the VALIDATED point. detach_every=0 (full-F BPTT) is the max-margin
#                            extrapolation but full-F backward is somewhat slower — reverted to 32 on 2026-08-06.
#                            NOTE: detach_every does NOT change the memory footprint of the epoch-0 peak. Epochs 0-3 run
#                            p_tf>0 (at epoch 0, p_tf=1 -> the PARALLEL forward: whole sequence in one pass), which never
#                            uses detach_every; peak mem there scales with F (and recon_frac), NOT detach_every. So if you
#                            OOM at epoch 0 (as small+F64+unet-decode did on 2026-08-06), lowering detach_every won't help
#                            — drop the batch (autobatch does this), lower recon_frac (<1 decodes fewer frames), or cut F.
grad_checkpoint: false     # wrap each rollout-step backbone forward in torch.utils.checkpoint -> AR memory ∝ detach_every not F; ~1.3x compute; default off
compile_rollout: false     # true -> torch.compile the AR rollout STEP (~6x, accelerations.md Exp 9). Requires
#                            head_dim (d/heads) >= 16 and is mutually exclusive with variations.contraction
#                            (its Jacobian power-iteration needs the eager graph). Declared so the bare override works.
# Temporal KV-cache is ON by default for INFERENCE rollouts (imagine_eval / MPPI; MultiModalSequenceModel.
# use_kv_cache, never used in training). It is the FAITHFUL sliding-window forward (cached == full-sequence
# masked forward, ~8e-7). NOTE: it also (correctly) un-truncates deep-layer receptive fields that the legacy
# per-step rollout truncated at the window's left edge -> for horizon > window the cached rollout differs
# slightly (~0.02 on decoded obs) from the pre-cache path. Within window it is identical. See smoke/kvcache.py.
diffusion:
  shortcut: false          # true -> K=1 sampling via self-consistency
  sampling_steps: 6
  predict: residual
  stochastic_eval: true    # TRAIN/EVAL MUST AGREE (user, 2026-08-10). predict_next uses
#                            det = (not training) and (not stochastic_eval), so TRAINING always rolls on
#                            SAMPLED predictions. With this false, every validation / eval routine / video
#                            instead rolled on the eps=0 committed MEAN — the model was trained under one
#                            rollout distribution and judged under another. true removes that mismatch.
#                            EVAL-ONLY: during training `not self.training` is already False, so this flag
#                            cannot change the training path.
#                            MEASURED cost of flipping it (ep4 taesd_exact, open_loop @128): psnr
#                            14.6227 -> 14.5502, lpips 0.5030 -> 0.5009, ssim 0.4206 -> 0.4145. Nothing
#                            moves, because the flow has learned a near-DETERMINISTIC map — which is itself
#                            the finding: the blur is in what the flow learned, not in how it is sampled.
  time_sampling: uniform
  flow_hidden: 0           # 0 -> mirror d
  flow_arch: mlp           # mlp | transformer — how the velocity net sees the OTHER tokens being denoised.
#                            mlp (DEFAULT, bit-identical to every run before 2026-08-10): a per-token MLP, so
#                              token k's velocity depends only on its own x_k and h_k. The K sampling steps
#                              therefore draw from PROD_k p(z_k | h_k) -- a FACTORIZED model. h is frozen for
#                              the whole denoising trajectory and cannot repair this: a product of correct
#                              marginals is not the correct joint. It is HARMLESS while eval is deterministic
#                              (stochastic_eval=false), because the mean of the factorized model equals the
#                              true marginal means -- what you get is blur, not incoherence.
#                            transformer: every denoising step attends across the n_state bag tokens, sampling
#                              a proper JOINT. This is the PREREQUISITE for stochastic_eval=true to buy
#                              sharpness instead of incoherent bags (token 3 committing to one future while
#                              token 5 commits to another). Uses plain SDPA, so compile_rollout's
#                              head_dim>=16-power-of-2 rule does not apply. Attention is over ~10 tokens, so
#                              the cost is params (~0.07M -> ~0.27M at d=128), not compute.
#                            The ACTION head always stays mlp: its lead axes are (B,T), so token-mixing there
#                            would mix over TIME.
  flow_arch_depth: 2       # transformer only: token-mixing blocks
  flow_arch_heads: 4       # transformer only: heads (head_dim = flow_hidden/heads; 9-10 tokens needs few)
# action-distribution head (design/models/flow_heads.md — the action-flow prior). A FlowField that predicts
# the NEXT action's distribution from the PREVIOUS-step backbone context h[t-1] (leak-free: it never sees the
# action a[t] it predicts, only history). Trained JOINTLY as an extra flow loss; it is a learned behavior/play
# prior used LATER as the MPPI proposal — its samples are NEVER fed back into the world model. Eyeballed via the
# eval_action_distribution routine (true-vs-pred histograms + animation). enabled: false -> no head, bit-identical.
action_head:
  enabled: true             # DEFAULT ON (2026-08-06) — NOT locked, flip freely. Was LOCKED false in the det16 era
  #                           (the joint head killed control ~0 + destabilized: unetflow NaN'd ~ep31, vitmse collapsed);
  #                           detach_every=32 (now default) fixed that — head-on is stable and controls well. CURRENT
  #                           bptt32 runs @ep30:  HEAD 4.25 goals/5, val 0.83   vs   NO-HEAD 4.50 goals/5, val 0.38 —
  #                           no-head edges control + far lower val loss; head-on also trains the joint MPPI action
  #                           prior. DETACH: our head uses detach_gradient=false (NOT detached — the action gradient
  #                           co-shapes the trunk; detachF beat detachT on every axis, see detach_gradient below).
  #                           Set false for the leaner no-head baseline. (Post-hoc on a frozen ckpt still valid.)
  weight: 1.0               # weight of the action-flow loss in the total training loss
  shortcut: false           # PURE RECTIFIED FLOW for the action prior — NOT default-on like the dynamics
  #   (diffusion.shortcut) / decode shortcuts, because the action prior is fundamentally different from
  #   OBSERVATION prediction. Those predict observations: given state+action the next state is (near-)
  #   DETERMINISTIC — a tight, unimodal target, so the noise->target field is smooth/straight and a single
  #   big step of size 2d lands in the SAME place as two chained steps of size d. The shortcut self-
  #   consistency loss TRAINS "1x(2d) == 2x(d)"; on a straight field that's free and buys fast K=1 sampling.
  #   The action head instead models p(action | context) — a DISTRIBUTION over BEHAVIOR, genuinely MULTIMODAL
  #   (the bimodal sampler's two thrust basins). There the field must CURVE to route different noise to
  #   different modes, so 1x(2d) and 2x(d) land in DIFFERENT places: the single straight step lands BETWEEN
  #   the modes (the mean), the two smaller steps follow the curve toward a mode. Forcing them equal then
  #   (a) COLLAPSES the modes toward the mean (loses multimodality) and (b) is a self-referential bootstrap
  #   (target = the model's own chained steps, stop-grad) with no ground-truth anchor -> trained POST-HOC on
  #   the frozen trunk it RAN AWAY (val 0.004 -> 8.8e6 -> ~1e22, NaN). shortcut=false (K-step ODE integration)
  #   is stable AND faithful — it samples BOTH basins (W1 ~0.1 vs diverged/NaN). The lost speedup is
  #   irrelevant: a 2-D action integrated over a few ODE steps is ~free (vs the WM, sampled in-rollout + in
  #   MPPI thousands of times, where K=1 matters). train_action_model defaults this false for the post-hoc
  #   path; override with ++model.action_head.shortcut=true only to reproduce the divergence.
  detach_gradient: false    # LOCKED false (user, 2026-07-21): NEVER set true. detach_gradient=true DESTABILIZED
  #                           the action flow — it exploded to ~1e22 (vit-mse run) and even when finite HURT OOD
  #                           (unetflow pointwise 1.13 vs 0.36 baseline). false = gradient flows into the trunk
  #                           (co-shapes it), the STABLE setting (matches the working 07-17 action-head run). DO NOT CHANGE.
  #                           RE-CONFIRMED 2026-08-05 (joint WM+action runs, shortcut=false, vit-mse): detachF (false)
  #                           beat detachT (true) on EVERY axis @ep10 — control 2.88 vs 1.75 goals/5, OOD pointwise
  #                           0.222 vs 0.470, learned-action-prior W1 0.011 vs 0.140 (13x better). detach=false lets the
  #                           action gradient co-shape the trunk -> better dynamics AND a better prior. (design/rollout_throughput.md)
modalities:
  # decode_kind: flow -> generative decode head per trunk (design/models/flow_heads.md). mse (default) =
  # deterministic decode, bit-identical to before. decode_shortcut: true -> K=1 sampling (EXPLICIT opt-in, like
  # the dynamics `diffusion.shortcut`; shortcut is never default-on). Starting BOTH trunks on flow to validate cross-trunk.
  # BEST-PERFORMANCE FINDING (2026-07-28, bimodal): for the IMAGE head, decode_kind=mse + decode_arch=vit (ViT-MSE,
  # the conditional-mean decoder) slightly BEAT decode_kind=flow + decode_arch=unet on every axis — val PSNR 18.9 vs
  # 18.3, OOD pointwise 0.24 vs 0.32, OOD PSNR 14.5 vs 12.6, control 4.12 vs 3.5. The image is a deterministic render,
  # so the conditional mean IS the target -> MSE has no downside here.
  # UPDATE 2026-08-06: DEFAULT image decode is now mse + UNET (conv, not the linear-patch ViT). The ViT decoder tiles
  # NON-OVERLAPPING patches -> a visible PATCH GRID at the seams; the conv U-Net has overlapping receptive fields ->
  # smooth, no grid. CAVEAT: unet+MSE is UNTESTED on metrics (the finding above was unet+FLOW vs vit+MSE, never
  # unet+mse) — expected to keep MSE's metrics AND kill the grid, but VALIDATE before trusting. encode stays ViT.
  - {name: proprio, kind: vector, dim: 6, weight: 1.0, decode_kind: flow, decode_param: x0, decode_arch: mlp}
  - {name: image, kind: image, num_tokens: 8, img_size: 128, patch: 16, ae_depth: 4, weight: 1.0, decode_kind: mse, decode_param: x0, encode_arch: conv, decode_arch: unet,
     pretrained: false, pretrained_name: madebyollin/taesd, pretrained_init: true, freeze: true, adapter: {depth: 2}}
  # TOKEN BUDGET RULE (measured 2026-08-09, robocasa 128px + frozen TAESD): keep num_tokens * d EXACTLY equal to
  #   the AE latent size (TAESD @128px -> 4*16*16 = 1024 floats; @256px -> 4096). NEVER pad.
  #   Padding is NOT idle capacity -- LayerNorm is PER TOKEN, so pad floats enter the mean/std the real floats are
  #   normalized BY and actively distort them: bag 32x128 (75% pad) floors at 16.03 dB vs 20.41 dB for EXACT 8x128,
  #   a 4.4 dB loss, worse than any num_tokens choice. The startup [adapter] line reports the mode and the fix.
  #   At a FIXED budget num_tokens and d see-saw, and both sides cost something (init floor, before the adapter
  #   residual trains -- these are NOT converged numbers):
  #     4x256 20.79 dB | 8x128 20.41 (default) | 16x64 20.01 | 32x32 19.72 | 64x16 18.68
  #   More tokens = finer spatial addressing for the dynamics (a token is a raster stripe of the latent grid;
  #   8 tokens = 2 rows each) but a smaller backbone (params ~ d^2) and more LayerNorm to undo (LN drops 2 scalars
  #   per token). Fewer tokens = the reverse. See design/capacity.md.
  # PRETRAINED IMAGE AE (issue #12): pretrained=false (default) -> the bespoke conv/unet AE above, BIT-IDENTICAL.
  #   pretrained=true -> TAESD (diffusers.AutoencoderTiny) encode/decode bridged to the num_tokens x d token bag by
  #   learned Perceiver adapters (encode_arch/decode_arch/decode_base then ignored). Gate (raw TAESD, no training):
  #   31 dB @128 vs the bespoke AE's pinned ~14.3 dB at the SAME 1024-float budget. pretrained_init=false random-inits
  #   the same arch (isolates prior vs architecture); freeze=true freezes TAESD (adapters+dynamics still train, and
  #   the AE is excluded from AdamW); adapter.depth = Perceiver refine blocks per adapter.
