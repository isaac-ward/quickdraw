# =============================================================================================
# vl128_blockstack_flow — vl128_blockstack_2cam with the two IMAGE heads on the up-backed FLOW decoder
# (decode_kind=flow, decode_arch=up -> UpFlowDecoder: the SAME up backend + a mimics-up analysis path).
# Select with `model=vl128_blockstack_flow`. Everything else is vl128_blockstack_2cam verbatim, so the ONLY
# variable vs the up-mse baseline is the decode head. See design/up_flow_decoder.md.
#
# WHY DETERMINISTIC x0 (decode_stochastic=false). flow.py:59-62 + record §19.3: a deterministic x0 decode is
# the CONDITIONAL MEAN (~= mse), so this arm tests the one thing that is safe to test in open loop — whether
# the DENOISING CURRICULUM (predict clean from noised-at-all-tau) shapes a better DETERMINISTIC decoder than
# plain mse (§19.3 measured flow-x0-deterministic beating mse 16% on frozen latents). It does NOT sample.
# STOCHASTIC decode (decode_stochastic=true) is the sharper-but-riskier follow-up: §19.3 found sampling
# "explores around a drifted latent" and LOSES in open-loop rollout. Run that only as a second arm.
#
# WARM-START from an up-mse checkpoint's backend (UpFlowDecoder is a superset at init) for a fast, fair A/B.
#
#   python -m quickdraw.train model=vl128_blockstack_flow environments=recorded \
#       data.repo_id=block-stack data.subsample=10 data.F=64 data.autobatch=false data.batch=<pinned> \
#       trainer.checkpoint_monitor=val/metric/cam_scene/mse
# =============================================================================================
defaults:
  - vl128_blockstack_2cam
  - _self_

modalities:
  # Restated in full: OmegaConf REPLACES lists rather than merging them. Only decode_kind changes on the
  # image heads (mse -> flow); every other value is vl128_blockstack_2cam verbatim.
  - {name: proprio, kind: vector, dim: 17, weight: 1.0, decode_kind: flow, decode_param: x0, decode_arch: mlp}

  - {name: cam_scene, kind: image, cam: scene_right, weight: 1.0,
     img_size: [96, 128], ae_bottleneck: 6, pretrained: false, num_tokens: 32,
     encode_arch: conv, encode_base: 32,
     decode_kind: flow, decode_arch: up, decode_base: 64, decode_param: x0, decode_stochastic: false,
     patch: 16, ae_depth: 4, decode_chunk_train: 64,
     visual_l1: 3.0, visual_l2: 0.0, visual_lpips: 1.0, visual_lpips_net: vgg, visual_frames: 128,
     latent_loss_weight: 10}

  - {name: cam_wrist, kind: image, cam: gripper_right_top, weight: 1.0,
     img_size: [96, 128], ae_bottleneck: 6, pretrained: false, num_tokens: 32,
     encode_arch: conv, encode_base: 32,
     decode_kind: flow, decode_arch: up, decode_base: 64, decode_param: x0, decode_stochastic: false,
     patch: 16, ae_depth: 4, decode_chunk_train: 64,
     visual_l1: 3.0, visual_l2: 0.0, visual_lpips: 1.0, visual_lpips_net: vgg, visual_frames: 128,
     latent_loss_weight: 10}
