# Proprio-only MultiModalFlow — same general backbone as mm_flow, image modality removed
# (ablation baseline for the vision comparison). eval_vision self-skips (no image head).
name: mm_flow
d: 32
depth: 4
heads: 8
window: 32
mlp_ratio: 4.0
rope_theta: 10000.0
action_dim: 2
lambda_flow: 1.0
lambda_consistency: 1.0
p_tf_start: 1.0
p_tf_end: 0.0
p_tf_warmup_epochs: 4
recon_frac: 1.0            # fraction (0-1) of the F rollout frames to supervise the decode recon on (train only;
                           #   ALL output modalities, same random subset per step). 1.0=all. <1 saves ViT-AE decode compute.
detach_every: 16
diffusion:
  shortcut: false
  sampling_steps: 6
  predict: residual
  stochastic_eval: false
  time_sampling: uniform
  flow_hidden: 0
modalities:
  - {name: proprio, kind: vector, dim: 6, weight: 1.0}
