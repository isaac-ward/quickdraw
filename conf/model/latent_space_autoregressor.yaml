name: lsar
# backbone (shared substrate with DSAR — keep these identical across the shoot-out)
d: 96
depth: 4
heads: 6                  # head_dim = d/heads = 16 (FlexAttention wants head_dim a power of 2)
window: 64
mlp_ratio: 4.0
rope_theta: 10000.0
# latent
dz: 16                    # latent width (dz < d); the compact world-state, fixed across mechanisms
dec_hidden: 64            # small decoder hidden width (kept small + identical across mechanisms)
lambda_pred_obs: 1.0      # weight on the unified obs-rollout loss (added by the LightningModule)
lambda_reg: 1.0           # distributional-regularizer weight (SIGReg/VICReg)
# pred_metric is set per-mechanism by the collapse strategy to match its paper (EMA=normed_mse, else mse)
expander_hidden: 256      # VICReg expander MLP width (VICReg only; discarded at eval)
expander_dim: 256         # VICReg expander embedding dim (where var/cov are computed)
# teacher-forcing curriculum + BPTT (same knobs/semantics as DSAR)
p_tf_start: 1.0
p_tf_end: 0.0
p_tf_warmup_epochs: 4
# detach_every: backprop-through-time span in the rollout. 0 = FULL BPTT across all F steps (most
# gradient signal, most memory); 8 = truncated 8-step segments; 1 = BPTT off (detach every step).
# Full BPTT at F=64 is the latest config that trained really well -> default to it.
detach_every: 0
# NOTE: the collapse mechanism is a separate Hydra group — add e.g. `+collapse=ema` on the CLI.
