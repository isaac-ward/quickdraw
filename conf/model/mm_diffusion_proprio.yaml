# Proprio-only MultiModalDiffusion — same general backbone as mm_diffusion, image modality removed
# (ablation baseline for the vision comparison). eval_vision self-skips (no image head).
name: mm_diffusion
d: 256
depth: 4
heads: 8
window: 32
mlp_ratio: 4.0
rope_theta: 10000.0
action_dim: 2
lambda_flow: 1.0
lambda_consistency: 1.0
p_tf_start: 1.0
p_tf_end: 0.0
p_tf_warmup_epochs: 4
detach_every: 16
diffusion:
  shortcut: false
  sampling_steps: 6
  predict: residual
  stochastic_eval: false
  time_sampling: uniform
  flow_hidden: 0
modalities:
  - {name: proprio, kind: vector, dim: 6, weight: 1.0}
