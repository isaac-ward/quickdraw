name: diffusion
# backbone (shared substrate with DSAR/LSAR — keep these identical across the shoot-out)
d: 96
depth: 4
heads: 6                  # head_dim = d/heads = 16 (FlexAttention wants head_dim a power of 2)
window: 64
mlp_ratio: 4.0
rope_theta: 10000.0
# latent (same compact world-state as LSAR)
dz: 16                    # latent width (dz < d)
dec_hidden: 64            # decoder hidden width; the flow field mirrors it (flow_hidden=0 -> dec_hidden)
lambda_pred_obs: 1.0      # weight on the unified obs-rollout (RECONSTRUCTION) loss — the anti-collapse grounding
lambda_flow: 1.0          # weight on the flow-matching prediction loss
lambda_consistency: 1.0   # weight on the shortcut self-consistency loss (shortcut only)

# flow head (design/models/diffusion.md "Config"). GROUNDING is reconstruction (required; the flow loss
# alone is not anti-collapse). contraction + diffusion is a HARD ERROR (asserted at construction).
diffusion:
  parameterization: flow      # SUPPORTED: "flow" only (subsumes ddpm/ddim).
  path: linear                # SUPPORTED: "linear" (rectified) only.
  predict: residual           # "residual" (diffuse Delta-z; default) | "absolute" (diffuse z_{t+1}).
  cond: concat                # "concat" (default) | "adaln" (future upgrade; raises if selected).
  shortcut: false             # false = plain flow (needs sampling_steps 4-8); true = step-size cond + self-consistency -> K=1 works.
  sampling_steps: 6           # K Euler steps / AR step at inference. plain flow -> 4-8 ; shortcut -> 1 (any K). >= 1.
  stochastic_eval: false      # false = deterministic ODE from eps=0 (reproducible metrics); true = fresh-noise samples (video spread).
  time_sampling: uniform      # "uniform" (default) | "logit_normal" (SD3-style, mid-noise weighted).
  flow_hidden: 0              # flow-field MLP hidden width; 0 -> mirror dec_hidden.

# teacher-forcing curriculum + BPTT (same knobs/semantics as DSAR/LSAR)
p_tf_start: 1.0
p_tf_end: 0.0
p_tf_warmup_epochs: 4
# detach_every: truncated BPTT span in the rollout. 16 = 16-step chunks (the variation-campaign default,
# ~4x faster than full BPTT); 0 = full BPTT across all F steps; 1 = BPTT off (detach every step).
detach_every: 16
