# vl128_blockstack_2cam_cube — the 2cam recipe with the proprio obs widened to 49 (17 state + 32 cube object-state
# from observation.objects.cube). The ONLY change vs vl128_blockstack_2cam is proprio dim 17 -> 49; pair with
# data.obs_fields=[observation.state, observation.objects.cube] and environments.obs_dim=49. Tests whether explicit
# cube state lets the WM preserve object identity through the rollout. See design + HF PROCESSING.md.
defaults:
  - vl128_blockstack_2cam
  - _self_

modalities:
  - {name: proprio, kind: vector, dim: 49, weight: 1.0, decode_kind: flow, decode_param: x0, decode_arch: mlp}
  - {name: cam_scene, kind: image, cam: scene_right, weight: 1.0,
     img_size: [96, 128], ae_bottleneck: 6, pretrained: false, num_tokens: 32,
     encode_arch: conv, encode_base: 32, decode_kind: mse, decode_arch: up, decode_base: 64,
     decode_param: x0, patch: 16, ae_depth: 4, decode_chunk_train: 64,
     visual_l1: 3.0, visual_l2: 0.0, visual_lpips: 1.0, visual_lpips_net: vgg, visual_frames: 128, latent_loss_weight: 10}
  - {name: cam_wrist, kind: image, cam: gripper_right_top, weight: 1.0,
     img_size: [96, 128], ae_bottleneck: 6, pretrained: false, num_tokens: 32,
     encode_arch: conv, encode_base: 32, decode_kind: mse, decode_arch: up, decode_base: 64,
     decode_param: x0, patch: 16, ae_depth: 4, decode_chunk_train: 64,
     visual_l1: 3.0, visual_l2: 0.0, visual_lpips: 1.0, visual_lpips_net: vgg, visual_frames: 128, latent_loss_weight: 10}
