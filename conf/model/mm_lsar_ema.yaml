name: mm_lsar
d: 32
depth: 4
heads: 8
window: 32
mlp_ratio: 4.0
rope_theta: 10000.0
action_dim: 2
lambda_pred_latent: 1.0
ema: true                  # I-JEPA/BYOL: EMA target encoder + online predictor; obs recon = decoder probe
ema_decay: 0.996
p_tf_start: 1.0
p_tf_end: 0.0
p_tf_warmup_epochs: 4
recon_frac: 1.0            # fraction (0-1) of the F rollout frames to supervise the decode recon on (train only;
                           #   ALL output modalities, same random subset per step). 1.0=all. <1 saves ViT-AE decode compute.
detach_every: 8
modalities:
  - {name: proprio, kind: vector, dim: 6, weight: 1.0}
  - {name: image, kind: image, num_tokens: 8, img_size: 128, patch: 16, ae_depth: 4, weight: 1.0}
