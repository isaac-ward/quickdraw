# =============================================================================================
# vl64_scene — ARM A. vl64 on swoosh-data/lego_assemblies, ONE camera (scene-right).
# Select with `model=vl64_scene data=lego`. Companion: conf/model/vl64_multicam.yaml (Arm B, 3 heads).
#
# Inherits vl64 and changes ONLY what this dataset forces:
#   * proprio dim 6 -> 34   (the 6D-encoded 34-dim bimanual xArm7 state; see conf/data/lego.yaml)
#   * image head renamed `image` -> `scene_right`
# Every vl64 image knob is carried through UNCHANGED so the recipe's measured behaviour transfers.
#
# WHY THE HEAD IS RENAMED. The modality name IS the batch key and the metric key
# (training/setup.py:815 passes image_head=img.name; lit.py:108-111 does obs[name] = batch[name]), and
# it is INDEPENDENT of data.cam, which only selects the file path. Arm B's three heads will be
# scene_right / arm_top_left / arm_top_right, so naming this one `scene_right` makes both arms log
# `val/metric/scene_right/mse` and the A/B answers one clean question: do the wrist cameras improve
# scene prediction? Leaving it as `image` would have made the two arms' metrics silently unjoinable.
#
# STILL TO PASS ON THE CLI (a model config cannot hold them), exactly as vl64/up64 document:
#     model.action_dim=20  environments=recorded  environments.obs_dim=34  environments.action_dim=20
#     environments.position_idx=[0,1,2]  data=lego  data.root=logs/recording_<ts>_lego
#     data.subsample=<DERIVED>          <- P3. 1 is wrong; see the placeholder note in conf/data/lego.yaml
#     model.diffusion.flow_hidden=512   <- every number quoted in vl64's header used it
#
# img_size 128 keeps vl64's DEFAULT ae_bottleneck of 8 (a 256x reduction, verified-exact). Do NOT drop
# to 96 without ALSO setting +model.modalities.1.ae_bottleneck=6 — at 96 the default 8 truncates to a
# 12x12 bottleneck, a materially less compressed codec than requested, with no warning. See up64's header.
#
# CARRIED-IN CAVEATS, all measured, none speculative:
#   * `action` is NOT in the state's frame on this dataset (no Euler convention fits — best 126.6 deg
#     median geodesic error, and ~126 deg is what two uniform RANDOM rotations give; per-session
#     extrinsics differ by 26-176 deg; grippers anti-correlated -0.72/-0.57). Action-conditioning here
#     is fitting noise. Run _oneoff_action_sensitivity early: a near-zero result is quickdraw#15, NOT
#     the model. The proprio+image dynamics are unaffected.
#   * vl64 GHOSTS ("perceptually plausible, spatially wrong") and its ROLLOUT is worse than up64's
#     (OL PSNR 13.42 vs 14.86) even as its codec is better. Read frames, not just LPIPS.
#   * vl64 COLLAPSED at eval 12 after one non-finite step. Watch `latent_cos`; negative is the signature.
# =============================================================================================
defaults:
  - vl64
  - _self_

modalities:
  # Restated in full: OmegaConf REPLACES lists rather than merging them, so inheriting vl64 and editing
  # one entry is impossible -- and being explicit is what makes the recipe auditable.
  - {name: proprio, kind: vector, dim: 34, weight: 1.0, decode_kind: flow, decode_param: x0, decode_arch: mlp}
  #   dim 34 = 2 arms x [tcp_xyz(3) 6d_rotation(6) j1..j7(7) gripper(1)]. The 6D block replaces the raw
  #   roll/pitch/yaw, which wraps 702/802 times per arm on this data because pitch reaches +-78 deg and
  #   pushes roll/yaw toward the gimbal singularity. Encoding happens in the PROCESSOR, so every consumer
  #   -- training, eval, norm stats -- sees 34 and never touches an Euler angle.
  #   Still plain MSE: VisualLoss is IMAGE-only (only ImageModality overrides Modality.recon_loss), and a
  #   state vector has no perceptual structure to score.
  - {name: scene_right, kind: image, weight: 1.0, img_size: 128,
     pretrained: false,
     num_tokens: 32,
     encode_arch: conv,
     encode_base: 32,
     decode_kind: mse,
     decode_arch: up,
     decode_base: 64,
     decode_param: x0, patch: 16, ae_depth: 4,
     decode_chunk_train: 64,
     # ---- vl64's L1+LPIPS visual loss, carried through verbatim. ONE VisualLoss instance used at BOTH
     #      the AR decode loss and the roundtrip anchor, so the pixel:perceptual RATIO is identical at
     #      both sites and only the magnitude differs.
     visual_l1: 1.0,
     visual_l2: 0.0,          # no squared term. This is what makes it ghost -- see the caveats above.
     visual_lpips: 1.0,       # the GAN-free published value (IRIS/VQGAN/LDM family).
     visual_lpips_net: vgg,   # TRAINING backbone. Never "squeeze" -- that is the REPORTED metric's net,
     #                          and training on it would make the number incomparable to every prior run.
     visual_frames: 128,
     latent_loss_weight: 10}  # DO NOT MOVE. Bracketed on BOTH sides in vl64: 0.4 erased 5.4 dB in one
     #                          epoch, 25 froze motion and drove gradients to inf. It is a RATIO knob
     #                          (stay invertible vs be predictable), not a magnitude knob.
