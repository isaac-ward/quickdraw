# =============================================================================================
# vl128_starling_heavy — vl128_starling with a DEEPER transition head. `model=vl128_starling_heavy`.
# The "heavy dynamics" arm. Read conf/model/vl128_starling.yaml first; this changes ONE number.
#
# WHY, measured on `starling_vl128` at epoch 10. The bottleneck is not long-horizon drift, it is the
# SINGLE-STEP transition, and the horizon curve says so unambiguously:
#
#     horizon      +1      +8     +32    +128
#     open-loop  0.1229  0.2691  0.2994  0.2900     <- flat from +8 onward
#     AE floor   0.0573  0.0670  0.0486  0.0358
#     dynamics    0.066   0.202   0.251   0.254     <- 80% of the total is spent by step 8
#
# 120 further steps after +8 add 0.05. The rollout does not drift, it diverges inside ~8 steps (1.3 s at
# 6 Hz) and then sits on a "generic plausible flight frame" plateau. Two more measurements pin it to ONE
# step: closed-loop-1 (re-ground EVERY step) still scores 0.148 against a 0.036 floor, so a single
# prediction costs 4x the codec; and `latent_motion_ratio@+8` is 0.50 while `latent_cos@+8` is 0.265 --
# the head predicts half the true latent motion in a direction barely correlated with truth. That pair is
# the signature of HEDGING, which is what a transition head does when it is under-powered or the state is
# under-determined.
#
# DEPTH, NOT WIDTH, AND THAT IS THE WHOLE POINT. `flow_hidden` is the axis with a body count: §23 records
# that EVERY L1+LPIPS run at flow_hidden=512 destroyed itself between eval 5 and eval 12, and narrowing it
# back to 128 (= d) is what fixed the collapse and set every record. So widening is off the table under
# this loss. `flow_arch_depth` has NEVER been varied in this project -- it has sat at 2 for every run --
# and it buys capacity on an orthogonal axis. 2 -> 4 doubles the transition transformer.
#
# WHAT WOULD FALSIFY IT: if a 4-block head does not move `latent_cos@+8` off ~0.27, the head is not the
# limit and the task is -- predicting 167 ms of egomotion from a 4-dim action may simply be near-aleatoric,
# in which case the next lever is CONTEXT (see below), not capacity.
#
# THE SECOND ARM IS `data.P=24` (see conf/data/starling_ctx.yaml), and it is deliberately NOT stacked here.
# Both are capacity-flavoured arguments; running them together makes any improvement unattributable.
#
# NOT COVERED HERE -- pass on the CLI, same as vl128_starling:
#   data=starling|starling2   data.subsample=5   environments=recorded
# =============================================================================================
defaults:
  - vl128_starling
  - _self_

diffusion:
  # THE change, and the only one. 2 -> 4 transformer blocks in the transition head.
  # flow_hidden stays at 128: see the header, widening it is the documented failure mode.
  flow_arch_depth: 4
