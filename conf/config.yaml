defaults:
  - model: mm_dsar_proprio
  - data: torus
  - optim: adamw
  - trainer: default
  - environments: torus
  - logging: wandb
  - eval: default
  - control: mppi
  - interpret: torus
  - reward: default
  - _self_

# language-steered control: set head (+ request) to make `eval_control` steer MPPI toward the request instead
# of the goal race. head=null (default) -> normal goal-based control (so in-training eval_control is unaffected).
# When head is set, `overrides` below are applied on top of `control:` (mppi) so language mode gets its own
# knobs without touching the goal-race defaults — only episode 0 is ever rendered, so running >1 episode (and
# the goal-race step budget) is wasted here. Add any other control key to override just for language mode.
language:
  request: red
  head: null   # path to a train_reward run's reward_head.pt (only then does eval_control do language steering)
  interpret_run: null   # eval_interpret run dir; when set (reward mode), animate the agent moving through its
                        # saved latent projections (backdrop cloud + X_c/X_r target crosses + agent sphere & tail)
  interpret_plots:      # which projections to animate (method needs an out-of-sample map: pca/lda/umap/umap-sup-*; NOT tsne)
    - {method: lda, factor: color, dims: [2, 3]}   # default: 2 animations/episode (color LDA, 2d + 3d)
  overrides:
    n_episodes: 1     # a single steered episode (raise n_episodes + n_plot together to render several)
    n_plot: 1         # how many episodes to render products for (control_video_i / rollout_i / distance_i / interpret)
    max_steps: 500    # give the reward-max controller room to migrate across the torus
    # (settling relies on the long horizon, like goal mode — beta_vel=0 by default, so r_settle is a no-op here)

# short experiment summary -> run dir is logs/<timestamp>_<experiment> (override on CLI)
experiment: base

# checkpoint path for the eval/control entrypoints (override on CLI)
checkpoint: null

# Train-time shaping variations (design/models/variations.md). An orthogonal axis: each composes with
# ANY world model via the SequenceWorldModel hook contract (DSAR / any LSAR / future RSSM / vision).
# All OFF by default (0) -> a baseline run is bit-identical. Enable on the CLI, e.g.
#   variations.noise_injection.std=0.05   variations.physical_loss.weight=1.0
#   variations.contraction.weight=1.0 variations.contraction.target=1.0
variations:
  noise_injection: { std: 0.0 }                  # sigma of Gaussian noise on the normalized obs INPUTS
  physical_loss:   { weight: 0.0, continuity: 0.0, warmup_epochs: 10 }  # weight: on-surface+tangent; continuity:
  #                  kinematic v=dp/dt; warmup_epochs: ramp the physical weight 0->1 over N epochs (schedules/)
  contraction:     { weight: 0.0, target: 1.02, power_iters: 2, n_sample_steps: 4 }  # hinge on sigma_max(one-step J)

# REQUIRED before any training run (train.py asserts all 5 are set): a 5-point experiment note,
# written to <run_dir>/auto_run_summary.txt and printed to the logs (so it's in the wandb console).
# MUST BE UNIQUE PER RUN: train.py fails if this note is identical to any previous run's. Rewrite it
# EVERY launch to describe THIS run's current hypothesis and what changed since the last attempt —
# a reused note is a stale, meaningless note. Never copy-paste a prior summary.
run_summary:
  problem: null          # 1. the problem we are facing
  tried: null            # 2. what we have tried so far
  trying: null           # 3. what we are trying in this run
  trying_detail: null    # 4. what we are trying, in more detail
  rationale: null        # 5. why we expect it to solve the existing problem
  allow_duplicate: false # set true ONLY for a deliberate exact rerun (bypasses the uniqueness check)

hydra:
  job:
    chdir: false
