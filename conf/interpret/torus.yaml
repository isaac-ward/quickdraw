# Per-environment interpretability config (eval_interpret). Swap for another env: conf/interpret/<env>.yaml,
# select on the CLI with interpret=<env>. eval_interpret imagines short clips, VLM-labels them by semantic
# factor, and recolors the eval_manifold latent projections by those labels (see design/interpretability.md).

n_clips: 1024         # imagined clips to label + embed (more (latent,label) pairs -> a better-generalizing reward head)
n_captions: 16        # detailed free-form VLM captions per clip (0 = off). CLIP-style reward training aligns f_z(latent)
#                       with f_t(MiniLM(caption)); varied real phrasings -> open-vocab steering. Same VLM call as labeling.
point: per_step       # per_step = every step's latent, clip label broadcast (dense, ~n_clips*clip_len points, comparable to eval_manifold); mean = one clip-mean latent per clip (sparse, clean)
clip_len: 30          # frames per clip (0.5s @ 60 Hz)
batch: 32             # clips imagined per forward pass (image-decode memory)
vlm_frames: 6         # frames subsampled from each clip fed to the VLM
seed: 0
imaginations: true    # dump per-clip imaginations (one dir per clip, one file per trunk + manifest.json) for a web explorer
umap_sup_weights: [0.1, 0.3, 0.9]    # supervised-UMAP target weights -> extra umap-sup-<w>/ dirs, each supervised by its own labels (forces separation; presentation, not evidence). Plain unsupervised umap is always produced too. NOTE >=~0.99 is degenerate (fully-supervised graph disconnects -> NaN layout); 0.9 is the practical "maximally forced".

vlm:
  model: gpt-4o
  max_workers: 8      # concurrent Responses-API calls (labeling is I/O-bound)
  # OPENAI_API_KEY is read from the environment (falls back to a repo-root .env)

# semantic factors. each factor declares its label SOURCE (source of truth for the plot coloring):
#   source: vlm      -> a VLM reads the RENDERED image (independent of the proprio-derived latent).
#   source: analytic -> computed exactly from the imagined proprio (deterministic, no API).
# `analytic` params double as the cross-check when source is vlm (VLM image reading graded vs proprio truth).
# buckets = the label set (also the legend order); colors = a matplotlib color per bucket for the legend.
factors:
  color:                       # the surface the agent is standing on
    source: vlm                # VLM reads the image -> the independent probe; analytic (environments/torus.color_at) cross-checks it
    # TRIMMED to the 7 PRODUCIBLE names: the ring is painted with plt.cm.hsv in 16 pure-hue bands, and
    # "light green" (shares green's hue) + "purple" (falls between blue-violet and magenta) are NEVER the
    # nearest to a real band — unsteerable/unverifiable, so dropped (see environments/torus.py + smoke/torus_env.py).
    buckets: [cyan, blue, pink, red, orange, yellow, green]
    colors:
      cyan: "#00ffff"
      blue: "#0000ff"
      pink: "#ff69b4"
      red: "#ff0000"
      orange: "#ffa500"
      yellow: "#ffff00"
      green: "#228b22"
    analytic:
      kind: hue_at_position    # NOTE: the exact ground truth is now environments/torus.color_at (band-accurate);
                               # this hue_centers map is the legacy per-clip cross-check (interpret.py rewire pending).
      hue_centers: {red: 0.0, orange: 0.09, yellow: 0.17, green: 0.34, cyan: 0.5, blue: 0.67, pink: 0.87}
  positioning:                 # where the agent is on the torus vertically (ambient height z)
    source: analytic           # exact from the imagined position; z = r*sin(phi) in [-r, +r] (r = tube radius)
    buckets: [top, middle, bottom]
    colors:  {top: "#d62728", middle: "#7f7f7f", bottom: "#1f77b4"}
    analytic:
      kind: z_band             # top/bottom = outer `frac` of the z-range (|z| > (1-2*frac)*r); else middle
      frac: 0.1                # top 10% and bottom 10% of the vertical extent are 'top'/'bottom'

prompt: |
  You are labeling a short first-person video clip (about half a second) recorded by an agent moving on the
  inside surface of a colorful torus world. The surface is painted with bands of color around a wheel:
  cyan, blue, purple, pink, red, orange, yellow, light green, green. The frames may be LOW-RESOLUTION or BLURRY —
  judge the dominant HUE, not fine texture. Report the color of the surface the agent is STANDING ON: look ONLY at
  the immediate foreground floor at the BOTTOM-CENTER of the frame (ignore the walls, the far distance, and any
  colors elsewhere in the view). Choose the single closest match from the listed colors; if it is between two,
  pick the more dominant / more saturated one. In "reasoning", FIRST briefly describe what you see on the
  bottom-center floor (a few words), THEN commit to the color. Also give a self_reported_confidence in [0,1]
  (lower it when the frames are blurry or ambiguous). Return ONLY the structured fields.

# appended to `prompt` when n_captions>0 (asks for exactly {n} detailed, diverse captions of THIS clip). These
# train f_t on real phrasings (CLIP-style), so any wording steers — NOT a fixed template set.
caption_prompt: |
  ALSO write exactly {n} short, natural-language captions, each describing THIS specific clip in a DIFFERENT
  way, as if telling someone what the agent is seeing and doing. Take into account the color of the surface it
  is standing on and where it sits on the ring vertically (near the top, around the middle, or near the bottom),
  and mention any motion you can see (climbing, descending, drifting left or right, fast or slow). Vary the
  wording, word order, and level of detail across the {n} captions — some terse ("red floor, near the top"),
  some fuller ("moving along a bright red band high up on the ring, drifting to the left"). Do NOT number them
  or reuse a fixed template; make them read like distinct human descriptions of the same moment. If any "Known
  exact facts" are given (e.g. the vertical position on the ring), treat them as ground truth and make EVERY
  caption consistent with them — the frames can be misleading about position, so trust the stated facts there.
