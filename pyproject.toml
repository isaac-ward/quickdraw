[project]
name = "quickdraw"
version = "0.1.0"
description = "Who's the fastest gun in the west? A world models shoot out."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # numpy and mujoco are PINNED EXACTLY because robocasa asserts on them at import:
  #   robocasa/__init__.py: assert numpy.__version__ in ["2.2.5"]   and   mujoco.__version__ == "3.3.1"
  # Not upper bounds, not ranges -- exact allow-lists upstream. Loosening either breaks `import robocasa`
  # with a bare AssertionError. torch/scipy/umap/sklearn are all fine on 2.2.5 (verified).
  "numpy==2.2.5",
  "mujoco==3.3.1",
  "scipy",
  "matplotlib",
  "tqdm",
  "hydra-core>=1.3",
  "torch>=2.5",
  "lightning>=2.3",
  "wandb",
  "lerobot",
  "torchcodec",
  "imageio[ffmpeg]",
  "pyvista",
  "umap-learn",
  "scikit-learn",
  "transformers",
  # --- rosbag2 flight recordings (data/rosbag.py). Pure Python, no ROS install needed.
  "rosbags",
  # --- robosuite/robocasa runtime needs. The two PACKAGES themselves are editable installs of the
  #     checkouts under /caches/sim (a runtime volume, so they cannot live in the image) -- see
  #     utils/setup_sim.sh, which relinks them after any rebuild. These are their importable deps:
  "h5py",
  "lxml",
  # opencv-python-HEADLESS, never plain opencv-python: the latter links libgthread/GTK, which this
  # container does not ship, so `import cv2` dies with ImportError: libgthread-2.0.so.0.
  "opencv-python-headless",
]

[project.optional-dependencies]
# --- NVIDIA Cosmos as an external world model (models/external_cosmos.py). NOT part of the default
#     install: nothing in quickdraw needs these unless you run `model=cosmos`, and the container already
#     ships diffusers/transformers/accelerate, so in practice this group is the guardrail and its deps.
#
#     Install with `uv pip install -e ".[cosmos]"` -- and DO read these two pins before touching them:
#       cosmos-guardrail declares transformers>=5, which would drag the container off 4.57 and away from
#       the diffusers 0.35 the Cosmos pipelines live in. It runs fine on 4.57, so it is installed
#       --no-deps and its real deps are listed here by hand.
#       nltk<3.10 because 3.10's pathsec refuses to open a symlink, and every file in the HF hub cache
#       IS a symlink -- the guardrail's blocklist corpus included.
cosmos = [
  "diffusers>=0.35",
  "accelerate",
  "better-profanity",
  "nltk<3.10",
  "peft",
  "retinaface-py",
  "scikit-image",
  "sentencepiece",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quickdraw"]

# Tell uv that this is a package
[tool.uv]
package = true
