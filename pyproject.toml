[project]
name = "quickdraw"
version = "0.1.0"
description = "Who's the fastest gun in the west? A world models shoot out."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "tqdm",
  "hydra-core>=1.3",
  "torch>=2.5",
  "lightning>=2.3",
  "wandb",
  "lerobot",
  "torchcodec",
  "imageio[ffmpeg]",
  "pyvista",
  "umap-learn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quickdraw"]

# Tell uv that this is a package
[tool.uv]
package = true
